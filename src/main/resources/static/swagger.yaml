openapi: 3.0.3
info:
  title: VulnPrint API Registry
  description: Professional API documentation for the VulnPrint Pentest Management Platform.
  version: 1.1.0
  contact:
    name: System Administrator
servers:
  - url: http://localhost:8080
    description: Local Development Node

tags:
  - name: Authentication
    description: Authorization and session management
  - name: Dashboard
    description: High-level metrics and project summaries
  - name: Pentest
    description: Management of security audit nodes
  - name: Vulnerability
    description: Documentation of technical security findings
  - name: Organization
    description: Global identity and branding configuration
  - name: User
    description: System user and role management
  - name: Report
    description: Consolidated data packages for generation

paths:
  /api/auth/login:
    post:
      summary: Initialize Authorization
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Access Granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Access Denied

  /api/dashboard/metrics:
    get:
      summary: Retrieve System-Wide Metrics
      tags:
        - Dashboard
      responses:
        '200':
          description: Aggregated security data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'

  /api/dashboard/pentests:
    get:
      summary: List Project Nodes
      tags:
        - Dashboard
      parameters:
        - name: type
          in: query
          schema:
            type: string
          description: Filter by Pentest Category
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Enriched project list

  /api/pentests:
    post:
      summary: Register New Pentest Node
      tags:
        - Pentest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pentest'
      responses:
        '200':
          description: Node Initialized

  /api/pentests/{id}:
    get:
      summary: Retrieve Node Attributes
      tags:
        - Pentest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Project metadata

  /api/pentests/{id}/report-details:
    put:
      summary: Synchronize Report Design Attributes
      tags:
        - Pentest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDetails'
      responses:
        '200':
          description: Configuration updated

  /api/organization:
    get:
      summary: Retrieve Global Branding
      tags:
        - Organization
      responses:
        '200':
          description: Master organizational data
    put:
      summary: Update Master Branding
      tags:
        - Organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organization'
      responses:
        '200':
          description: Branding synchronized

  /api/users/profile/{username}:
    get:
      summary: Retrieve Operator Profile
      tags:
        - User
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User attributes

  /api/vulnerabilities:
    post:
      summary: Register Security Finding
      tags:
        - Vulnerability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vulnerability'
      responses:
        '200':
          description: Finding synced

components:
  schemas:
    AuthResponse:
      type: object
      properties:
        status: { type: string }
        token: { type: string }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }
        profileImage: { type: string }

    DashboardMetrics:
      type: object
      properties:
        totalPentests: { type: integer }
        totalVulnerabilities: { type: integer }
        critical: { type: integer }
        high: { type: integer }
        medium: { type: integer }
        low: { type: integer }
        info: { type: integer }
        globalRiskScore: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        role: { type: string }

    Organization:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        address: { type: string }
        logo: { type: string }

    Pentest:
      type: object
      properties:
        id: { type: integer }
        pentestName: { type: string }
        clientName: { type: string }
        pentestType: { type: string }
        status: { type: string }

    Vulnerability:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        severity: { type: string }
        cvssScore: { type: number }
        cvssVector: { type: string }
        evidenceMode: { type: string, enum: [STEPS, REQRES, SOURCE] }

    ReportDetails:
      type: object
      properties:
        disclaimerEnabled: { type: boolean }
        methodologyEnabled: { type: boolean }
        methodologyDisplayMode: { type: string }
        owaspEnabled: { type: boolean }
        riskOverviewEnabled: { type: boolean }
        conclusionEnabled: { type: boolean }
