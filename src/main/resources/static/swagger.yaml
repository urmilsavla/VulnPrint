openapi: 3.0.3
info:
  title: VulnPrint API Documentation
  description: API documentation for VulnPrint, a vulnerable web application for pentest reporting.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local development server

paths:
  /api/auth/login:
    post:
      summary: Login a user
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  token:
                    type: string
                    description: Username used as token
                  email:
                    type: string
                  firstName:
                    type: string
                  lastName:
                    type: string
                  role:
                    type: string
                  profileImage:
                    type: string
                  message:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string

  /api/dashboard/metrics:
    get:
      summary: Get dashboard metrics
      tags:
        - Dashboard
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalPentests:
                    type: integer
                  totalVulnerabilities:
                    type: integer
                  critical:
                    type: integer
                  high:
                    type: integer
                  medium:
                    type: integer
                  low:
                    type: integer
                  info:
                    type: integer
                  globalRiskScore:
                    type: string

  /api/dashboard/pentests:
    get:
      summary: Get enriched list of pentests
      tags:
        - Dashboard
      parameters:
        - name: type
          in: query
          schema:
            type: string
          description: Filter by pentest type (Web, Mobile, etc.)
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 3
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    pentestName:
                      type: string
                    applicationName:
                      type: string
                    clientName:
                      type: string
                    clientSpocName:
                      type: string
                    clientSpocContact:
                      type: string
                    pentestType:
                      type: string
                    target:
                      type: string
                    url:
                      type: string
                    apiDomain:
                      type: string
                    ipRanges:
                      type: string
                    createdDate:
                      type: string
                      format: date-time
                    lastModifiedDate:
                      type: string
                      format: date-time
                    status:
                      type: string
                    assignedPentesters:
                      type: array
                      items:
                        $ref: '#/components/schemas/User'
                    lastModifiedTimeAgo:
                      type: string
                    critical:
                      type: integer
                    high:
                      type: integer
                    medium:
                      type: integer
                    low:
                      type: integer
                    info:
                      type: integer
                    riskIndex:
                      type: string

  /api/pentests:
    post:
      summary: Create a new pentest
      tags:
        - Pentest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pentest'
      responses:
        '200':
          description: Pentest created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pentest'

  /api/pentests/{id}:
    get:
      summary: Get a pentest by ID
      tags:
        - Pentest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pentest'
        '404':
          description: Pentest not found
    delete:
      summary: Delete a pentest by ID
      tags:
        - Pentest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pentest deleted
        '404':
          description: Pentest not found

  /api/pentests/{id}/status:
    patch:
      summary: Update pentest status
      tags:
        - Pentest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status updated
        '404':
          description: Pentest not found

  /api/pentests/{id}/report-details:
    put:
      summary: Update report designer details
      tags:
        - Pentest
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                disclaimerEnabled:
                  type: boolean
                disclaimer:
                  type: string
                methodologyEnabled:
                  type: boolean
                methodologyDisplayMode:
                  type: string
                  enum: [TEXT_ONLY, IMAGE_ONLY, BOTH]
                methodology:
                  type: string
                methodologyImage:
                  type: string
                  description: JSON string containing array of Base64 custom images
                selectedMethodologyImages:
                  type: string
                  description: Comma-separated IDs of selected pool images
                owaspEnabled:
                  type: boolean
                owaspTop10:
                  type: string
                  description: Comma-separated IDs of enabled frameworks
                selectedOwaspCategories:
                  type: string
                  description: Double-pipe (||) separated framework item strings
                riskOverviewEnabled:
                  type: boolean
                riskSummary:
                  type: string
                severityEnabled:
                  type: boolean
                severityDefinitions:
                  type: string
                  description: JSON string containing severity levels and impact criteria
                conclusionEnabled:
                  type: boolean
                conclusion:
                  type: string
      responses:
        '200':
          description: Report details updated
        '404':
          description: Pentest not found

  /api/reports/master-data/{pentestId}:
    get:
      summary: Get all data for a report in a single consolidated package
      tags:
        - Report
      parameters:
        - name: pentestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful consolidated data package
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessmentMetadata:
                    type: object
                  reportConfiguration:
                    type: object
                  securityFindings:
                    type: array
                    items:
                      type: object
        '404':
          description: Pentest not found

  /api/users:
    get:
      summary: Get all users
      tags:
        - User
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'

  /api/users/profile:
    get:
      summary: Get user profile by email
      tags:
        - User
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      summary: Update user profile
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                address:
                  type: string
                qualification:
                  type: string
                profileImage:
                  type: string
      responses:
        '200':
          description: Profile updated

  /api/users/register:
    post:
      summary: Register a new user
      tags:
        - User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User created successfully

  /api/vulnerabilities:
    post:
      summary: Create a new vulnerability
      tags:
        - Vulnerability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vulnerability'
      responses:
        '200':
          description: Vulnerability created

  /api/vulnerabilities/{id}:
    get:
      summary: Get vulnerability by ID
      tags:
        - Vulnerability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vulnerability'
    put:
      summary: Update vulnerability by ID
      tags:
        - Vulnerability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vulnerability'
      responses:
        '200':
          description: Vulnerability updated
    delete:
      summary: Delete vulnerability by ID
      tags:
        - Vulnerability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Vulnerability deleted

components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        password:
          type: string
          writeOnly: true
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
        address:
          type: string
        qualification:
          type: string
        profileImage:
          type: string

    Pentest:
      type: object
      properties:
        id:
          type: integer
        applicationName:
          type: string
        pentestName:
          type: string
        clientName:
          type: string
        clientSpocName:
          type: string
        clientSpocContact:
          type: string
        target:
          type: string
        pentestType:
          type: string
          enum: [Web, Mobile, API, Network, Source Code]
        createdDate:
          type: string
          format: date-time
        lastModifiedDate:
          type: string
          format: date-time
        status:
          type: string
        assignedPentesters:
          type: array
          items:
            $ref: '#/components/schemas/User'
        url:
          type: string
        osType:
          type: string
        apiDomain:
          type: string
        ipRanges:
          type: string
        zipHash:
          type: string
        version:
          type: string
        techStack:
          type: string
        packageName:
          type: string
        apiType:
          type: string
        targetType:
          type: string
        repoUrl:
          type: string
        branchName:
          type: string
        language:
          type: string
        disclaimerEnabled:
          type: boolean
        disclaimer:
          type: string
        methodologyEnabled:
          type: boolean
        methodologyDisplayMode:
          type: string
        methodology:
          type: string
        methodologyImage:
          type: string
        selectedMethodologyImages:
          type: string
        owaspEnabled:
          type: boolean
        owaspTop10:
          type: string
        selectedOwaspCategories:
          type: string
        riskOverviewEnabled:
          type: boolean
        riskSummary:
          type: string
        severityEnabled:
          type: boolean
        severityDefinitions:
          type: string
        conclusionEnabled:
          type: boolean
        conclusion:
          type: string
        vulnerabilities:
          type: array
          items:
            $ref: '#/components/schemas/Vulnerability'

    Vulnerability:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        cweReference:
          type: string
        owasp:
          type: string
        description:
          type: string
        impact:
          type: string
        mitigation:
          type: string
        cvssScore:
          type: number
        cvssVector:
          type: string
        severity:
          type: string
        status:
          type: string
        evidenceMode:
          type: string
          enum: [STEPS, REQRES, SOURCE]
        requestResponse:
          type: string
        fileName:
          type: string
        lineNumber:
          type: string
        codeSnippet:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/VulnerabilityStep'

    VulnerabilityStep:
      type: object
      properties:
        id:
          type: integer
        stepNumber:
          type: integer
        description:
          type: string
        request:
          type: string
        response:
          type: string
        fileName:
          type: string
        lineNumber:
          type: string
        imagePaths:
          type: array
          items:
            type: string
