<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>VulnPrint | API System</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" >
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #000000; }
        
        /* Modern Dark Theme for Swagger UI */
        .swagger-ui { filter: invert(88%) hue-rotate(180deg) brightness(1.1); }
        .swagger-ui .topbar { display: none; }
        .swagger-ui .info .title { color: #000; font-family: 'Space Grotesk', sans-serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        .swagger-ui .scheme-container { background: transparent; box-shadow: none; border-top: 1px solid rgba(0,0,0,0.1); }
        .swagger-ui .opblock { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .swagger-ui select { cursor: pointer; border-radius: 8px; }
        .swagger-ui .btn { border-radius: 8px; text-transform: uppercase; font-weight: 700; }
        
        /* Specific overrides for our brand green */
        .swagger-ui .opblock.opblock-post { background: rgba(79, 254, 73, 0.1); border-color: #4FFE49; }
        .swagger-ui .opblock.opblock-get { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        
        #custom-header {
            background: #000;
            padding: 2rem 4rem;
            border-bottom: 1px solid #262626;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-logo { height: 50px; }
        .terminal-status { font-family: monospace; color: #4FFE49; font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@900&display=swap" rel="stylesheet">
</head>
<body>
    <header id="custom-header">
        <img src="/images/logo.png" class="brand-logo" alt="VulnPrint">
        <div class="terminal-status">Status: API_Online // v1.0.0</div>
    </header>

    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"> </script>
    <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"> </script>
    <script>
    window.onload = function() {
      const ui = SwaggerUIBundle({
        url: "/swagger.yaml",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        docExpansion: "list",
        defaultModelsExpandDepth: 1
      })
      window.ui = ui
    }
  </script>
</body>
</html>

</body>
</html>
