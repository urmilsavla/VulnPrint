spring.application.name=vulnprint

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/vulnprint?options=-c%20timezone=UTC
spring.datasource.username=vulnuser
spring.datasource.password=vulnpassword

# HikariCP settings to force timezone on connection initialization
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.data-source-properties.options=-c timezone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serving Static Content
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Mailpit SMTP Configuration
spring.mail.host=127.0.0.1
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Error Handling & Security Hardening
server.error.include-stacktrace=never
server.error.include-message=always
server.error.whitelabel.enabled=false

# Payload Size Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=50MB
spring.jackson.serialization.fail-on-empty-beans=false

# ===================================================================
# VULNPRINT CENTRALIZED CONFIGURATION CORE
# ===================================================================

# --- [SECURITY & CRYPTOGRAPHY] ---
# JWT Signing Key: Used to sign and verify access tokens. Must be at least 32 characters.
# In production, set the VULNPRINT_JWT_SECRET environment variable.
vulnprint.security.jwt-secret=${VULNPRINT_JWT_SECRET:vUlNpRiNt_sEcUrE_jWt_sEcReT_kEy_2026_zXyZ}

# Internal Vault Key: Used for encrypting PII (like addresses) in the database.
# In production, set the VULNPRINT_INTERNAL_ENC environment variable.
vulnprint.security.vault-key=${VULNPRINT_INTERNAL_ENC:VaUlTpRiNt_InTeRnAl_EnCrYpTiOn_KeY_pAsS}

# Lockdown Key: Emergency secret required to trigger a global system reset/session purge.
# In production, set the VULNPRINT_LOCKDOWN_KEY environment variable.
vulnprint.security.lockdown-key=${VULNPRINT_LOCKDOWN_KEY:vUlNpRiNt_eMeRgEnCy_lOcKdOwN_kEy_sEcrEt}

# Token Validity: Duration in milliseconds for which a JWT remains valid (14400000 = 4 hours).
vulnprint.security.jwt-expiration-ms=14400000

# --- [SSRF SHIELD WHITELIST] ---
# Hostnames permitted for internal microservice communication.
vulnprint.security.ssrf.allowed-hosts=localhost,127.0.0.1,vulndb.internal,repgen.internal
# Network ports permitted for internal microservice communication.
vulnprint.security.ssrf.allowed-ports=8000,3000,8080,1025

# --- [ROOT AUTHORITY PROVISIONING] ---
# The immutable system administrator account identity.
vulnprint.superadmin.email=superadmin@vulnprint.com
# The initial password for the superadmin account (set during first bootstrap).
vulnprint.superadmin.password=VulnPrintAdmin08$
# The qualification displayed for the root account in official reports.
vulnprint.superadmin.qualification=Immutable Root Authority

# --- [COMMUNICATION & LIFECYCLE] ---
# The official 'From' address for all automated system emails.
vulnprint.email.from-address=security@vulnprint.local
# Duration (hours) before a new user invitation link expires.
vulnprint.auth.invitation-expiry-hours=24
# Duration (minutes) before a password reset link expires.
vulnprint.auth.password-reset-expiry-mins=15
# Duration (minutes) before an MFA OTP verification code expires.
vulnprint.auth.mfa-otp-expiry-mins=5

# --- [STORAGE & INTEGRITY] ---
# Root directory for all Proof-of-Concept (POC) evidence and image uploads.
vulnprint.storage.upload-dir=uploads

# --- [EXTERNAL SERVICES] ---
# Default fallback URLs for microservices if not configured in the database.
vulnprint.services.vulndb.default-url=http://vulndb.internal:8000
vulnprint.services.repgen.default-url=http://repgen.internal:3000

# --- [ANALYTICS & RISK MODEL] ---
# Coefficients used to calculate the Global Risk Index (0.0 - 10.0).
vulnprint.analytics.risk-weight.critical=10.0
vulnprint.analytics.risk-weight.high=7.0
vulnprint.analytics.risk-weight.medium=4.0
vulnprint.analytics.risk-weight.low=2.0
vulnprint.analytics.risk-weight.info=0.1
# --- [SECURITY THRESHOLDS & LIFECYCLES] ---
# Window (ms) for MFA completion (Default: 2 mins).
vulnprint.security.pre-auth-expiry-ms=120000
# Duration (days) for stateful session persistence (Refresh Tokens).
vulnprint.security.session-expiry-days=7
# Minimum character count for organizational password compliance.
vulnprint.security.password.min-length=8
# Buffer (ms) to account for clock skew during token invalidation.
vulnprint.security.token-invalidation-buffer-ms=500

# --- [LOCKOUT & BRUTE-FORCE PROTECTION] ---
# Duration (minutes) an account remains frozen after failed logins.
vulnprint.security.lockout.login-duration-mins=15
# Threshold of failed login attempts before triggering a lockout.
vulnprint.security.lockout.login-max-attempts=5
# Duration (minutes) an account remains frozen after failed MFA attempts.
vulnprint.security.lockout.mfa-duration-mins=30
# Threshold of failed MFA attempts before triggering a lockout.
vulnprint.security.lockout.mfa-max-attempts=3

# --- [RATE LIMITING PROFILES] ---
# Profile: LOGIN (POST /api/auth/login)
vulnprint.ratelimit.login.max-requests=100
vulnprint.ratelimit.login.window-ms=60000
# Profile: AUTH (MFA, Refresh, Activation)
vulnprint.ratelimit.auth.max-requests=200
vulnprint.ratelimit.auth.window-ms=60000
# Profile: VIEWS (Public HTML rendering)
vulnprint.ratelimit.views.max-requests=1000
vulnprint.ratelimit.views.window-ms=60000

# --- [COMMUNICATION TEMPLATES] ---
# Subject lines for automated system emails.
vulnprint.email.subject.invitation=Action Required: VulnPrint Account Provisioned
vulnprint.email.subject.mfa-otp=VulnPrint Security: Your MFA Verification Code
vulnprint.email.subject.password-reset=Security Notification: Password Reset Requested
# Professional signature used in all system communications.
vulnprint.email.signature=The VulnPrint Security Team
# Global professional error message displayed during 500 errors.
vulnprint.ui.error.unexpected-message=An unexpected error occurred. Please contact support and provide the Correlation ID.

# --- [BUSINESS & REPORTING LOGIC] ---
# Number of items displayed in dashboard "Recent" panels.
vulnprint.ui.dashboard.recent-activity-limit=15
vulnprint.ui.dashboard.recent-projects-limit=3
# Initial states for newly created system entities.
vulnprint.logic.default.pentest-status=Active
vulnprint.logic.default.vuln-reporting-status=Submitted
vulnprint.logic.default.vuln-severity=Low
# Format prefix for finding IDs in official reports (e.g., VULN-001).
vulnprint.logic.report.reference-prefix=VULN-

# --- [UI ASSETS & FALLBACKS] ---
vulnprint.ui.assets.default-user-image=/images/user.png

