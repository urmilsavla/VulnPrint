spring.application.name=vulnprint

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vulnprint?options=-c%20timezone=UTC
spring.datasource.username=vulnuser
spring.datasource.password=vulnpassword

# HikariCP settings to force timezone on connection initialization
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
spring.datasource.hikari.data-source-properties.options=-c timezone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Explicitly set the dialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Serving Static Content
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Error Handling & Security Hardening
server.error.include-stacktrace=never
server.error.include-message=always
server.error.whitelabel.enabled=false

# Payload Size Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-http-post-size=50MB
spring.jackson.serialization.fail-on-empty-beans=false
