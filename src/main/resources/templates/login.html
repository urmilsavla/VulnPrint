<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>VulnPrint | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { 
                headline: ['Space Grotesk', 'sans-serif'], 
                body: ['Inter', 'sans-serif'] 
              },
              boxShadow: { terminal: "0 0 0 1px rgba(38,38,38,0.85), 0 30px 80px rgba(0,0,0,0.55)" }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { background: #000000; margin: 0; }
        
        .tile-card { background: rgba(19, 19, 19, 0.6); border: 1px solid #262626; transition: all 0.3s ease; backdrop-filter: blur(12px); }
        
        .radar-bg {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 50%, rgba(79, 254, 73, 0.05) 0%, transparent 70%);
        }

        .terminal-grid {
            background-image: 
                linear-gradient(to right, rgba(79, 254, 73, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(79, 254, 73, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .toast-entry { animation: toast-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: toast-out 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toast-in { from { transform: translateX(100%) scale(0.9); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes toast-out { from { transform: translateX(0) scale(1); opacity: 1; } to { transform: translateX(100%) scale(0.9); opacity: 0; } }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">
    <div class="absolute inset-0 terminal-grid pointer-events-none"></div>
    
    <!-- Notification Container -->
    <div id="notification-container" class="fixed top-8 right-8 z-[300] flex flex-col gap-4 pointer-events-none"></div>

    <main class="min-h-screen flex flex-col items-center justify-center relative px-6 py-20 z-10">
        <!-- 1. Logo in Upper Middle -->
        <div class="mb-10 text-center">
            <img alt="VulnPrint Logo" class="h-16 mx-auto brightness-110" src="/images/logo.png">
        </div>

        <!-- 2. Centered Content Box -->
        <div class="w-full max-w-md">
            <!-- Login Tile -->
            <div id="login-tile" class="tile-card p-10 rounded-2xl shadow-terminal relative overflow-hidden">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-headline font-black uppercase text-white mb-2">Welcome Back</h1>
                    <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Sign in to your account</p>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Email Address</label>
                        <input name="email" type="email" autocomplete="off" class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg font-body" placeholder="e.g. user@domain.com" required>
                    </div>
                    <div class="space-y-2 relative">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Password</label>
                        <div class="relative">
                            <input name="password" autocomplete="off" oninput="evaluatePassword(this.value)" class="w-full bg-black/60 border border-neutral-800 text-white p-4 pr-12 text-sm focus:border-primary outline-none transition-colors rounded-lg font-body" placeholder="Enter password" type="password" id="password" required>
                            <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-neutral-500 hover:text-primary transition-colors focus:outline-none">
                                <span id="eye-icon" class="material-symbols-outlined text-xl">visibility</span>
                            </button>
                        </div>
                        <div id="pwd-strength-container" class="mt-2 hidden">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[7px] font-black uppercase text-neutral-600 tracking-widest">Strength Check</span>
                                <span id="pwd-strength-text" class="text-[7px] font-black uppercase tracking-widest text-neutral-600">None</span>
                            </div>
                            <div class="flex gap-1 h-0.5">
                                <div id="bar-1" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-2" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-3" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-4" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="pt-4">
                        <button class="w-full bg-primary text-black font-headline font-black py-4 uppercase text-[10px] tracking-widest hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all rounded-lg" type="submit">
                            Sign In
                        </button>
                    </div>

                    <div class="text-center mt-6">
                        <button type="button" onclick="openRequestModal()" class="text-[10px] font-headline font-black uppercase tracking-[0.2em] text-neutral-500 hover:text-primary transition-colors">
                            Request an account
                        </button>
                    </div>
                </form>
            </div>

            <!-- MFA Challenge Tile -->
            <div id="mfa-tile" class="tile-card p-10 rounded-2xl shadow-terminal relative overflow-hidden hidden">
                <div class="text-center mb-8">
                    <span class="material-symbols-outlined text-primary text-5xl mb-4">enhanced_encryption</span>
                    <p class="text-[12px] text-neutral-300 uppercase tracking-widest font-black">Check your email for the 6-digit code</p>
                </div>

                <form id="mfaForm" class="space-y-6">
                    <input type="hidden" id="preAuthToken" name="preAuthToken">
                    <div class="space-y-2 text-center">
                        <input name="otp" maxlength="6" autofocus class="w-full bg-black/60 border border-neutral-800 text-white text-3xl font-mono text-center tracking-[0.5em] p-4 focus:border-primary outline-none transition-colors rounded-lg" placeholder="000000" required>
                    </div>
                    
                    <div class="pt-4">
                        <button class="w-full bg-primary text-black font-headline font-black py-4 uppercase text-[10px] tracking-widest hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all rounded-lg" type="submit">
                            Verify Code
                        </button>
                    </div>
                    <div class="text-center mt-4">
                        <button type="button" onclick="window.location.reload()" class="text-[9px] font-headline font-black uppercase tracking-[0.2em] text-neutral-600 hover:text-white transition-colors">
                            Back to login
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Request Access Modal -->
    <div id="request-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[200] hidden items-center justify-center p-4">
        <div class="tile-card w-full max-w-lg p-10 shadow-terminal rounded-2xl relative overflow-hidden">
            <button onclick="closeRequestModal()" class="absolute top-6 right-6 text-neutral-500 hover:text-white transition-colors">
                <span class="material-symbols-outlined">close</span>
            </button>
            <div class="text-center mb-8">
                <h3 class="text-2xl font-headline font-black uppercase tracking-widest text-white mb-2">Request Access</h3>
                <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Submit your details to request an account.</p>
            </div>
            <form id="requestForm" class="space-y-6">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">First Name</label>
                        <input name="firstName" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none rounded-lg font-body" placeholder="e.g. Jane">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Last Name</label>
                        <input name="lastName" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none rounded-lg font-body" placeholder="e.g. Smith">
                    </div>
                </div>
                <div class="space-y-2">
                    <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Email Address</label>
                    <input name="email" type="email" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none rounded-lg font-body" placeholder="e.g. jane.smith@domain.com">
                </div>
                <div class="space-y-2">
                    <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Professional Qualification</label>
                    <input name="qualification" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none rounded-lg font-body" placeholder="e.g. Senior Security Researcher">
                </div>
                <div class="space-y-2">
                    <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Reason for Access</label>
                    <textarea name="reason" required rows="2" class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none rounded-lg resize-none font-body" placeholder="Briefly explain your need for access..."></textarea>
                </div>
                <button type="submit" class="w-full bg-primary text-black font-headline font-black py-4 uppercase text-[10px] tracking-widest hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all rounded-lg mt-4">Submit Request</button>
            </form>
        </div>
    </div>

    <script>
        window.showNotification = function(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            let color = '#4FFE49';
            if (type === 'error') color = '#ff7351';
            toast.className = `flex items-center gap-4 bg-[#0e0e0e] border-l-4 p-4 shadow-2xl min-w-[300px] pointer-events-auto transition-all duration-300 transform translate-x-full font-body`;
            toast.style.borderColor = color;
            toast.innerHTML = `<div class="flex-1 text-xs text-white font-medium">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.style.transform = 'translateX(0)', 10);
            setTimeout(() => {
                toast.style.transform = 'translateX(110%)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        function evaluatePassword(pwd) {
            const container = document.getElementById('pwd-strength-container');
            if (!pwd) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');

            let strength = 0;
            const reqs = {
                length: pwd.length >= 8,
                upper: /[A-Z]/.test(pwd),
                lower: /[a-z]/.test(pwd),
                num: /[0-9]/.test(pwd),
                spec: /[^A-Za-z0-9]/.test(pwd)
            };

            if (reqs.length) strength++;
            if (reqs.upper) strength++;
            if (reqs.lower) strength++;
            if (reqs.num) strength++;
            if (reqs.spec) strength++;

            const bars = [document.getElementById('bar-1'), document.getElementById('bar-2'), document.getElementById('bar-3'), document.getElementById('bar-4')];
            bars.forEach(b => b.className = 'flex-1 bg-neutral-800 rounded-full transition-all');
            
            const textEl = document.getElementById('pwd-strength-text');
            
            if (strength <= 3) {
                bars[0].classList.add('bg-error');
                if (strength >= 2) bars[1].classList.add('bg-error');
                textEl.innerText = 'Weak';
                textEl.className = 'text-[7px] font-black uppercase tracking-widest text-error';
            } else if (strength === 4) {
                bars[0].classList.add('bg-orange-500');
                bars[1].classList.add('bg-orange-500');
                bars[2].classList.add('bg-orange-500');
                textEl.innerText = 'Good';
                textEl.className = 'text-[7px] font-black uppercase tracking-widest text-orange-500';
            } else if (strength === 5) {
                bars.forEach(b => b.classList.add('bg-primary'));
                textEl.innerText = 'Strong';
                textEl.className = 'text-[7px] font-black uppercase tracking-widest text-primary';
            }
        }

        function openRequestModal() {
            document.getElementById('request-modal').classList.remove('hidden');
            document.getElementById('request-modal').classList.add('flex');
        }

        function closeRequestModal() {
            document.getElementById('request-modal').classList.add('hidden');
            document.getElementById('request-modal').classList.remove('flex');
            document.getElementById('requestForm').reset();
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = 'SIGNING IN...';
            
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    if (data.status === 'MFA_REQUIRED') {
                        document.getElementById('login-tile').classList.add('hidden');
                        document.getElementById('mfa-tile').classList.remove('hidden');
                        document.getElementById('preAuthToken').value = data.preAuthToken;
                        window.showNotification('Please verify your identity with the code sent to your email.', 'info');
                    } else {
                        localStorage.setItem('user', JSON.stringify(data));
                        window.location.href = '/dashboard';
                    }
                } else {
                    window.showNotification(data.message || 'Login failed. Please check your credentials.', 'error');
                }
            } catch (err) {
                window.showNotification('System Error: Unable to communicate with the server.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'SIGN IN';
            }
        });

        document.getElementById('mfaForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = 'VERIFYING...';
            
            try {
                const res = await fetch('/api/auth/verify-mfa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    localStorage.setItem('user', JSON.stringify(data));
                    window.showNotification('Identity verified successfully.', 'success');
                    setTimeout(() => window.location.href = '/dashboard', 1000);
                } else {
                    window.showNotification(data.message || 'Verification failed. Incorrect code.', 'error');
                }
            } catch (err) {
                window.showNotification('System Error: Unable to verify code.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'VERIFY CODE';
            }
        });

        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerText = 'SUBMITTING...';
            
            try {
                const res = await fetch('/api/auth/apply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.fromEntries(new FormData(e.target)))
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    closeRequestModal();
                    window.showNotification('Your request has been submitted successfully.', 'success');
                } else {
                    window.showNotification(data.message || 'Failed to submit request.', 'error');
                }
            } catch (err) {
                window.showNotification('System Error: Unable to submit request.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'SUBMIT REQUEST';
            }
        });
    </script>
</body>
</html>
