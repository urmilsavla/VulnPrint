<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Generate Report</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface-container-low": "#131313",
                "surface-container-high": "#1f1f1f",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351",
                "tertiary": "#88f6ff",
                "outline-variant": "#484848",
              },
              fontFamily: { headline: ['Space Grotesk'], body: ['Inter'], label: ['Space Grotesk'] },
              boxShadow: { terminal: "0 0 0 1px rgba(38,38,38,0.85), 0 30px 80px rgba(0,0,0,0.55)" }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }
        
        .project-tile {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .project-tile:hover {
            border-color: rgba(79, 254, 73, 0.3);
            background: rgba(79, 254, 73, 0.02);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
        }

        .gen-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .gen-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }
        .gen-btn:hover::after {
            width: 300%;
            height: 300%;
        }
    </style>
</head>
<body class="radar-bg text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-12 relative z-10 text-left">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-10 border-b border-neutral-800 pb-8">
                <div class="flex items-center gap-6">
                    <div>
                        <h1 class="text-3xl font-headline font-black uppercase text-white tracking-tight">Generate Reports</h1>
                        <p class="text-neutral-500 mt-1 uppercase text-[9px] tracking-widest font-bold">Select a completed project to export documentation</p>
                    </div>
                    <a href="/template-guide" class="flex items-center gap-2 px-4 py-2 bg-neutral-900/50 border border-neutral-800 text-neutral-400 hover:text-primary transition-all rounded-lg group">
                        <span class="material-symbols-outlined text-sm">auto_stories</span>
                        <span class="text-[9px] font-black uppercase tracking-widest">Documentation Guide</span>
                    </a>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4" id="completed-projects">
                <!-- Skeleton Loaders -->
                <div class="h-24 bg-surface-container-low border border-neutral-900 animate-pulse rounded-xl"></div>
                <div class="h-24 bg-surface-container-low border border-neutral-900 animate-pulse rounded-xl"></div>
            </div>
        </div>
    </main>

    <script th:inline="javascript">
        async function loadCompletedProjects() {
            try {
                const res = await fetch('/api/dashboard/pentests?page=0&size=100');
                const projects = await res.json();
                
                const completed = projects.filter(p => p.status === 'Completed');
                const container = document.getElementById('completed-projects');
                
                if (completed.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-20 bg-surface-container-low/40 border border-neutral-900 rounded-xl">
                            <span class="material-symbols-outlined text-neutral-800 text-6xl mb-4">folder_off</span>
                            <p class="text-neutral-600 uppercase text-[10px] font-black tracking-widest">No completed projects available</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = completed.map(p => `
                    <div class="project-tile p-6 rounded-xl flex items-center justify-between group">
                        <div class="flex items-center gap-6">
                            <div class="w-12 h-12 bg-black/40 border border-neutral-800 flex items-center justify-center rounded-lg group-hover:border-primary/30 transition-colors">
                                <span class="material-symbols-outlined text-primary text-2xl">description</span>
                            </div>
                            <div>
                                <h3 class="text-white font-headline font-bold uppercase text-lg group-hover:text-primary transition-colors tracking-tight">${p.pentestName}</h3>
                                <div class="flex items-center gap-4 mt-1">
                                    <span class="text-[10px] text-neutral-500 uppercase font-black tracking-widest">${p.clientName}</span>
                                    <span class="w-1 h-1 bg-neutral-800 rounded-full"></span>
                                    <span class="text-[10px] text-neutral-500 uppercase font-black tracking-widest">${p.pentestType}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center">
                            <button id="btn-gen-${p.id}" onclick="generateReport(${p.id})" class="gen-btn px-10 py-3.5 bg-primary text-black text-[10px] font-black uppercase tracking-widest hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all flex items-center gap-2 rounded-lg">
                                <span class="material-symbols-outlined text-sm">rocket_launch</span>
                                Generate Report
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                window.showNotification('Failed to load projects', 'error');
            }
        }

        async function generateReport(id) {
            const btn = document.getElementById(`btn-gen-${id}`);
            const originalContent = btn.innerHTML;
            
            try {
                btn.disabled = true;
                btn.innerHTML = '<span class="material-symbols-outlined text-sm animate-spin">sync</span> PROCESSING...';
                
                window.showNotification('Assembling high-fidelity report package...', 'info');
                
                const dataRes = await fetch(`/api/repGenApi/${id}`);
                if (!dataRes.ok) throw new Error('Data assembly failed');
                const reportData = await dataRes.json();
                
                const configRes = await fetch('/api/config');
                const configs = await configRes.json();
                const repgenUrl = configs.find(c => c.configKey === 'repgen_url')?.configValue;
                
                if (!repgenUrl) {
                    throw new Error('RepGen Base URL not configured. Please set it in Microservice Management.');
                }
                
                window.showNotification('Handing over to RepGen engine...', 'info');
                const targetApi = `${repgenUrl.replace(/\/$/, '')}/api/process`;
                
                const formData = new FormData();
                formData.append('mode', 'json');
                formData.append('json', JSON.stringify(reportData));

                const response = await fetch(targetApi, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const blob = await response.blob();
                    if (blob.size === 0) throw new Error('Received an empty file from the report engine.');
                    
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    
                    const date = new Date().toISOString().split('T')[0];
                    const safeName = (reportData.pentestDetails?.projectName || 'Report').replace(/[^a-z0-9]/gi, '_');
                    link.download = `VulnPrint_Report_${safeName}_${date}.docx`;
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    window.showNotification('Report generated and downloaded successfully.', 'success');
                } else {
                    const errorText = await response.text();
                    throw new Error(`Report Engine Error (${response.status}): ${errorText || 'Unknown Error'}`);
                }

            } catch (err) {
                console.error(err);
                window.showNotification('Generation failed: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }
        }

        document.addEventListener('DOMContentLoaded', loadCompletedProjects);
    </script>
</body>
</html>
