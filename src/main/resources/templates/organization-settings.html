<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Organizational Details</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }

        .tile-card { background: rgba(19, 19, 19, 0.4) !important; border: 1px solid #262626 !important; backdrop-filter: blur(12px); transition: all 0.3s ease; }
        .tile-header { cursor: pointer; }
        .tile-content { max-height: 5000px; overflow: visible; transition: all 0.5s cubic-bezier(0, 1, 0, 1); }
        .collapse-icon { transition: transform 0.3s ease; color: #525252; }
        .tile-card.collapsed .tile-content { max-height: 0; opacity: 0; padding: 0 !important; margin: 0 !important; overflow: hidden; pointer-events: none; }
        .tile-card.collapsed .collapse-icon { transform: rotate(-90deg); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4FFE49; }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20 relative z-10">
        <div class="max-w-6xl mx-auto">
            <!-- Header Section -->
            <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12 border-b border-neutral-800 pb-8">
                <div>
                    <h1 class="heading-main flex items-center gap-3">
                        <span class="material-symbols-outlined text-primary text-4xl">business</span>
                        Organizational Details
                    </h1>
                    <p class="label-sub mt-1">Manage system-wide branding and contact information</p>
                </div>
                <button onclick="saveSettings()" class="btn-primary px-10">Save Changes</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <!-- Tile 1: System Branding -->
                <div class="tile-card p-8 rounded-xl shadow-2xl h-fit" id="tile-branding">
                    <div class="tile-header flex justify-between items-center mb-8 text-white" onclick="toggleTile('tile-branding')">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-primary text-3xl">palette</span>
                            <h2 class="text-xl font-headline font-bold uppercase tracking-tight">System Branding</h2>
                        </div>
                        <span class="material-symbols-outlined collapse-icon">expand_more</span>
                    </div>
                    <div class="tile-content">
                        <div class="space-y-6">
                            <div id="logo-preview-container" class="h-48 w-full flex items-center justify-center bg-black/40 rounded-xl overflow-hidden border border-white/5 p-4">
                                <img id="img-logo" src="/images/logo.png" class="max-h-full object-contain opacity-80 group-hover:opacity-100 transition-opacity">
                            </div>
                            <button onclick="document.getElementById('logo-input').click()" class="btn-secondary w-full py-3.5 !text-[10px]">Upload New Logo</button>
                            <input type="file" id="logo-input" class="hidden" accept="image/*" onchange="handleLogoUpload(event)">
                            <p class="text-[9px] text-neutral-600 text-center italic leading-relaxed px-4">Default logo used for automated reporting and client deliverables.</p>
                        </div>
                    </div>
                </div>

                <!-- Tile 2: Contact Information -->
                <div class="tile-card p-8 rounded-xl shadow-2xl lg:col-span-2" id="tile-identity">
                    <div class="tile-header flex justify-between items-center mb-8 text-white" onclick="toggleTile('tile-identity')">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-primary text-3xl">contact_mail</span>
                            <h2 class="text-xl font-headline font-bold uppercase tracking-tight">Contact Information</h2>
                        </div>
                        <span class="material-symbols-outlined collapse-icon">expand_more</span>
                    </div>
                    <div class="tile-content">
                        <div class="space-y-8">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div class="space-y-2">
                                    <label class="label-sub ml-1">Entity Name</label>
                                    <input type="text" id="org-name" class="input-terminal" placeholder="e.g. VulnPrint Security Services">
                                </div>
                                <div class="space-y-2">
                                    <label class="label-sub ml-1">Email ID</label>
                                    <input type="email" id="org-email" class="input-terminal font-mono" placeholder="e.g. security@vulnprint.io">
                                </div>
                                <div class="space-y-2">
                                    <label class="label-sub ml-1">Phone Number</label>
                                    <input type="text" id="org-phone" class="input-terminal" placeholder="e.g. +1 (555) 123-4567">
                                </div>
                            </div>
                            <div class="space-y-2">
                                <label class="label-sub ml-1">Location / Address</label>
                                <textarea id="org-address" rows="5" class="input-terminal resize-none" placeholder="e.g. 123 Terminal Elite Tower, Cyber City"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let logoBase64 = null;

        function toggleTile(tileId) {
            const tile = document.getElementById(tileId);
            tile.classList.toggle('collapsed');
        }

        async function loadSettings() {
            try {
                const res = await fetch('/api/organization');
                if (res.ok) {
                    const org = await res.json();
                    document.getElementById('org-name').value = org.name || '';
                    document.getElementById('org-address').value = org.address || '';
                    document.getElementById('org-phone').value = org.phone || '';
                    document.getElementById('org-email').value = org.email || '';
                    if (org.logo) {
                        logoBase64 = org.logo;
                        document.getElementById('img-logo').src = logoBase64;
                        document.getElementById('img-logo').classList.remove('opacity-80');
                    }
                }
            } catch (err) { console.error('Failed to load organization settings'); }
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                logoBase64 = e.target.result;
                document.getElementById('img-logo').src = logoBase64;
                document.getElementById('img-logo').classList.remove('opacity-80');
                window.showNotification("Logo preview updated. Save changes to commit.", "info");
            };
            reader.readAsDataURL(file);
        }

        async function saveSettings() {
            if (!(await window.askPermission("Commit changes to organizational branding and contact details?"))) return;

            const data = {
                name: document.getElementById('org-name').value,
                address: document.getElementById('org-address').value,
                phone: document.getElementById('org-phone').value,
                email: document.getElementById('org-email').value,
                logo: logoBase64
            };
            try {
                const res = await fetch('/api/organization', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    window.showNotification("System profile updated successfully.", 'success');
                } else {
                    const err = await res.json();
                    window.showNotification(err.message || "Failed to commit changes.", 'error');
                }
            } catch (err) { 
                window.showNotification("Communication failure with security backend.", 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
