<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Organization Settings</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff"
              },
              fontFamily: { body: ['Inter'] }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: #050505; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
    </style>
</head>
<body class="text-on-surface font-body">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-12 border-b border-neutral-800 pb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white">Organization Profile</h1>
                    <p class="text-neutral-400 mt-1">Global reporting identity and contact information</p>
                </div>
                <button onclick="saveSettings()" class="px-8 py-2 bg-primary text-black font-bold text-xs uppercase tracking-wider hover:opacity-90 shadow-lg">Save Profile</button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
                <!-- Logo Upload -->
                <div class="space-y-6">
                    <p class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest">Master Logo</p>
                    <div class="flex flex-col items-center gap-6 p-8 bg-neutral-900/40 border border-neutral-800 rounded-2xl">
                        <div id="logo-preview-container" class="h-40 w-full flex items-center justify-center bg-black/40 rounded-xl overflow-hidden border border-neutral-800">
                            <img id="img-logo" src="/images/logo.png" class="max-h-32 object-contain opacity-80">
                        </div>
                        <button onclick="document.getElementById('logo-input').click()" class="w-full px-4 py-2 border border-neutral-700 text-[10px] font-bold uppercase hover:bg-white/5 transition-colors rounded-lg">Update Master Logo</button>
                        <input type="file" id="logo-input" class="hidden" accept="image/*" onchange="handleLogoUpload(event)">
                        <p class="text-[9px] text-neutral-600 text-center italic leading-relaxed">This logo serves as the default branding for all new assessments and report covers.</p>
                    </div>
                </div>

                <!-- Form -->
                <div class="lg:col-span-2 space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest">Organization Name</label>
                            <input type="text" id="org-name" class="w-full bg-neutral-900/60 border border-neutral-800 rounded-lg p-3 text-sm focus:border-primary outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest">Official Email</label>
                            <input type="email" id="org-email" class="w-full bg-neutral-900/60 border border-neutral-800 rounded-lg p-3 text-sm focus:border-primary outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest">Contact Number</label>
                            <input type="text" id="org-phone" class="w-full bg-neutral-900/60 border border-neutral-800 rounded-lg p-3 text-sm focus:border-primary outline-none transition-all">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest">Headquarters Address</label>
                        <textarea id="org-address" rows="4" class="w-full bg-neutral-900/60 border border-neutral-800 rounded-lg p-3 text-sm focus:border-primary outline-none transition-all resize-none"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let logoBase64 = null;

        async function loadSettings() {
            const res = await fetch('/api/organization');
            if (res.ok) {
                const org = await res.json();
                document.getElementById('org-name').value = org.name || '';
                document.getElementById('org-address').value = org.address || '';
                document.getElementById('org-phone').value = org.phone || '';
                document.getElementById('org-email').value = org.email || '';
                if (org.logo) {
                    logoBase64 = org.logo;
                    document.getElementById('img-logo').src = logoBase64;
                    document.getElementById('img-logo').classList.remove('opacity-80');
                }
            }
        }

        function handleLogoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                logoBase64 = e.target.result;
                document.getElementById('img-logo').src = logoBase64;
                document.getElementById('img-logo').classList.remove('opacity-80');
            };
            reader.readAsDataURL(file);
        }

        async function saveSettings() {
            const data = {
                name: document.getElementById('org-name').value,
                address: document.getElementById('org-address').value,
                phone: document.getElementById('org-phone').value,
                email: document.getElementById('org-email').value,
                logo: logoBase64
            };
            const res = await fetch('/api/organization', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                window.showNotification('Organization profile updated.', 'success');
            }
        }

        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
