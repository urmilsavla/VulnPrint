<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>VulnPrint | Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                'primary': '#39FF14',
                'surface': '#0e0e0e',
                'on-background': '#ffffff',
                'error': '#ff7351',
              },
              fontFamily: {
                headline: ['Space Grotesk'],
                body: ['Inter'],
                label: ['Space Grotesk']
              },
              borderRadius: {DEFAULT: '0px'},
            },
          },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        .neon-border-glow:focus-within { box-shadow: 0 0 15px rgba(57, 255, 20, 0.3); border-color: #39FF14; }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(57, 255, 20, 0.6); }
        .terminal-grid {
            background-image: 
                linear-gradient(to right, rgba(57, 255, 20, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(57, 255, 20, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .corner-accent::before {
            content: ''; position: absolute; top: -2px; left: -2px; width: 15px; height: 15px; border-top: 2px solid #39FF14; border-left: 2px solid #39FF14;
        }
        .corner-accent::after {
            content: ''; position: absolute; bottom: -2px; right: -2px; width: 15px; height: 15px; border-bottom: 2px solid #39FF14; border-right: 2px solid #39FF14;
        }
        body { background: black; min-height: 100vh; overflow-y: auto; overflow-x: hidden; }
        .toast-entry { animation: toast-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: toast-out 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes toast-in { from { transform: translateX(100%) scale(0.9); opacity: 0; } to { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes toast-out { from { transform: translateX(0) scale(1); opacity: 1; } to { transform: translateX(100%) scale(0.9); opacity: 0; } }
    </style>
</head>
<body class="text-on-background selection:bg-primary selection:text-black">
    <main class="min-h-screen flex items-center justify-center relative px-6 py-20">
        <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <div class="absolute inset-0 terminal-grid opacity-30"></div>
            <div class="absolute top-12 left-12 -translate-x-12 -translate-y-12 w-[800px] h-[800px] bg-primary/5 rounded-full blur-[150px]"></div>
        </div>

        <div class="w-full max-w-md z-10">
            <div class="bg-black border border-primary/20 p-10 relative corner-accent">
                <div class="mb-12 flex flex-col items-center">
                    <div class="mb-8">
                        <img alt="VulnPrint Logo" class="w-auto filter brightness-110 contrast-125 h-[100px] mx-auto" src="/images/logo.png">
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="h-[1px] w-8 bg-primary"></span>
                        <p class="font-label text-primary tracking-[0.3em] text-[10px] font-bold uppercase">Authorized Access</p>
                    </div>
                </div>

                <form id="loginForm" class="space-y-6">
                    <div class="space-y-2">
                        <label class="font-label text-[10px] tracking-widest text-primary/60 font-black uppercase block ml-1">Username</label>
                        <div class="relative neon-border-glow border border-primary/20 bg-black transition-all">
                            <input name="username" autocomplete="off" class="w-full bg-transparent border-none text-primary placeholder:text-primary/10 font-headline tracking-widest text-sm focus:ring-0 p-4 outline-none" placeholder="Enter username" type="text" id="username" required>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="font-label text-[10px] tracking-widest text-primary/60 font-black uppercase block ml-1">Password</label>
                        <div class="relative neon-border-glow border border-primary/20 bg-black transition-all flex items-center pr-4">
                            <input name="password" autocomplete="off" class="flex-1 bg-transparent border-none text-primary placeholder:text-primary/10 font-headline tracking-widest text-sm focus:ring-0 p-4 outline-none" placeholder="Enter password" type="password" id="password" required>
                            <button type="button" onclick="togglePassword()" class="text-primary/40 hover:text-primary transition-colors focus:outline-none">
                                <span id="eye-icon" class="material-symbols-outlined text-xl">visibility</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <a href="/reset-password" class="text-[9px] font-black text-primary/40 hover:text-primary transition-colors uppercase tracking-[0.2em]">Forgot Password?</a>
                    </div>
                    <button class="w-full bg-primary text-black font-headline font-black py-4 tracking-[0.2em] uppercase text-xs btn-glow active:scale-[0.98] transition-all flex items-center justify-center gap-3" type="submit">
                        LOGIN
                    </button>
                </form>
            </div>

            <div class="mt-12 flex flex-col items-center gap-6 opacity-40">
                <div class="flex items-center gap-4">
                    <img alt="Security Shield" class="h-6 grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAr7e2o-BtyJZ7Y_xVKPl6XoYky985WrO4JKV4yLl8WDiOFf4PQ5JDGd5vKTQD2Xps-2qM5eFUTH92zoxgfd0N8ugIQhBTVgecR5nNfLiDIC9WiL7GCaNqBe-YF81ukDt5L08_uikMr4_6G2fcc1cE2QmoU8F7GFi5z7qnP1TKiSSFG7zY859tudWDbInnPgrFcFrrAVCBFQTAy2c9OXp9uIQG3fyV1gt5n_ebNU8iizSMTZTQLAa5XGM3It2v-s7xOtYVmZaoU6_BQ">
                    <img alt="Encryption Standard" class="h-4 grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDddrHfJ56dOOxQ_kIDKmNrMQDpcLN4xMsjDlUdOFDCK4iTzfKML8DV8kV6gRxRywpZc1MRAy3nS1Apg-YPaXXpurLcZ1RIOkilm1d4MTq6ValvtSHIFeFWRUwJHn8bv6AYYsYb8ni4SUe6U2VBYAfbIIV5MeI4n6MQBAaLvBqZ-TSGd3xVG4f4R7sHrfipEtgl90voOfP8UkLS9x2GN39_1WWvMIpBI09JE4LEj70V9TirB1KZgViQml0F85q0P1IXHhl9KLZyiR1b">
                </div>
            </div>
        </div>
    </main>

    <!-- Custom Terminal Notifications -->
    <div id="notification-container" class="fixed top-8 right-8 z-[100] flex flex-col gap-4 pointer-events-none"></div>

    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('eye-icon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                pwd.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            let color = '#39FF14'; let icon = 'info';
            if (type === 'error') { color = '#ff7351'; icon = 'warning'; }
            toast.className = `toast-entry pointer-events-auto flex items-center gap-4 bg-[#0e0e0e] border-l-4 p-4 shadow-2xl min-w-[300px]`;
            toast.style.borderColor = color;
            toast.innerHTML = `<span class="material-symbols-outlined" style="color: ${color}">${icon}</span><div class="flex-1"><p class="text-[10px] font-black uppercase tracking-[0.2em]" style="color: ${color}">${type}</p><p class="text-xs text-white font-medium mt-0.5">${message}</p></div>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-entry', 'toast-exit'); setTimeout(() => toast.remove(), 400); }, 4000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const jsonData = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(jsonData)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('email', data.email);
                    localStorage.setItem('firstName', data.firstName);
                    localStorage.setItem('lastName', data.lastName);
                    localStorage.setItem('role', data.role);
                    if (data.profileImage) {
                        localStorage.setItem('profileImage', data.profileImage);
                    }
                    window.location.href = '/dashboard';
                } else {
                    showNotification(data.message || 'Invalid Credentials', 'error');
                }
            } catch (error) { 
                console.error('Error:', error); 
                showNotification('System Error', 'error');
            }
        });
    </script>
</body>
</html>
