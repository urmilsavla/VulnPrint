<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | System Error</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { headline: ['Space Grotesk'], body: ['Inter'], label: ['Space Grotesk'] }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { background: #000000; margin: 0; }
        .radar-bg {
            background-color: #000000;
            background-image: radial-gradient(circle at 50% 50%, rgba(255, 115, 81, 0.05) 0%, transparent 70%);
        }
        .terminal-grid {
            background-image: 
                linear-gradient(to right, rgba(255, 115, 81, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 115, 81, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .tile-card { background: rgba(19, 19, 19, 0.6); border: 1px solid #262626; transition: all 0.3s ease; }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-error selection:text-black">
    <div class="absolute inset-0 terminal-grid pointer-events-none"></div>

    <main class="min-h-screen flex items-center justify-center relative px-6 py-20 z-10">
        <div class="w-full max-w-lg text-center">
            <div class="mb-12">
                <span class="material-symbols-outlined text-[80px] text-error mb-4">warning</span>
                <h1 class="text-6xl font-black text-white tracking-tighter mb-2" th:text="${code}">500</h1>
                <p class="font-label text-error tracking-[0.4em] text-xs font-black uppercase">Application Error</p>
            </div>

            <div class="tile-card p-10 rounded-2xl shadow-3xl backdrop-blur-xl border-error/20">
                <div class="flex items-center gap-3 mb-8 justify-center">
                    <span class="h-[1px] w-6 bg-error/40"></span>
                    <p class="font-label text-neutral-500 tracking-[0.2em] text-[10px] font-black uppercase">Diagnostic Message</p>
                    <span class="h-[1px] w-6 bg-error/40"></span>
                </div>
                
                <p class="text-white font-mono text-sm leading-relaxed mb-10" th:text="${message}">An unexpected server error occurred.</p>
                
                <a id="action-btn" href="/dashboard" class="inline-block px-10 py-4 bg-neutral-900 border border-neutral-800 text-neutral-400 font-bold text-xs uppercase tracking-widest hover:text-white hover:border-error/40 transition-all rounded-lg">Return to Dashboard</a>
            </div>
            
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const btn = document.getElementById('action-btn');
                    const hasToken = document.cookie.split(';').some((item) => item.trim().startsWith('JWT='));
                    if (!hasToken) {
                        btn.href = '/login';
                        btn.innerText = 'Go to Login';
                    }
                });
            </script>
            
            <div class="mt-8">
                <p class="text-[9px] font-black text-neutral-700 uppercase tracking-[0.3em]">Error logged in system</p>
            </div>
        </div>
    </main>
</body>
</html>
