<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | My Profile</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { headline: ['Space Grotesk'], body: ['Inter'], label: ['Space Grotesk'] }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }

        .tile-card { background: rgba(19, 19, 19, 0.4); border: 1px solid #262626; transition: all 0.3s ease; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4FFE49; }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20">
        <div class="max-w-4xl mx-auto">
            <div class="flex justify-between items-center mb-12 border-b border-neutral-800 pb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white uppercase">My Profile</h1>
                    <p class="text-neutral-400 mt-1">Manage your personal identity and professional credentials</p>
                </div>
                <button type="button" onclick="document.getElementById('profile-form').requestSubmit()" class="px-8 py-2 bg-primary text-black font-bold text-xs uppercase tracking-wider hover:opacity-90 shadow-lg">Save Profile</button>
            </div>

            <!-- Profile Tile -->
            <div class="tile-card p-10 rounded-xl shadow-2xl relative overflow-hidden group">
                <div class="flex items-center gap-4 mb-10 text-white">
                    <span class="material-symbols-outlined text-primary text-3xl">account_circle</span>
                    <h2 class="text-xl font-bold">Profile Attributes</h2>
                </div>

                <div class="flex flex-col items-center mb-12 relative z-10">
                    <div class="relative cursor-pointer group" onclick="document.getElementById('img-upload').click()">
                        <img id="profile-preview" class="w-32 h-32 rounded-full border-2 border-primary/20 object-cover group-hover:border-primary transition-all shadow-[0_0_30px_rgba(79,254,73,0.1)]" src="/images/user.png">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/60 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-white">upload</span>
                        </div>
                    </div>
                    <input type="file" id="img-upload" class="hidden" accept="image/*" onchange="previewImage(this)">
                    <p class="text-[8px] font-label text-neutral-500 uppercase tracking-widest mt-4 font-black">Click avatar to update</p>
                </div>

                <form id="profile-form" class="space-y-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div>
                            <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest mb-3 font-bold">Email Address</label>
                            <input type="email" name="email" readonly class="w-full bg-black/40 border border-neutral-800 text-neutral-500 p-4 text-sm outline-none cursor-not-allowed rounded-lg">
                        </div>
                        <div>
                            <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest mb-3 font-bold">Role / Designation</label>
                            <input type="text" name="role" readonly class="w-full bg-black/40 border border-neutral-800 text-neutral-500 p-4 text-sm outline-none cursor-not-allowed rounded-lg">
                        </div>
                        <div>
                            <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest mb-3 font-bold">First Name</label>
                            <input type="text" name="firstName" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg">
                        </div>
                        <div>
                            <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest mb-3 font-bold">Last Name</label>
                            <input type="text" name="lastName" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest mb-3 font-bold">Location / Address</label>
                        <textarea name="address" rows="2" class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors resize-none rounded-lg"></textarea>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest font-bold">Professional Qualifications</label>
                            <span class="text-[8px] text-neutral-600 uppercase font-black tracking-widest">Included in reports</span>
                        </div>
                        <textarea name="qualification" rows="3" class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors resize-none rounded-lg" placeholder="e.g. OSCP, CISSP, CEH..."></textarea>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    document.getElementById('profile-preview').src = base64;
                    localStorage.setItem('profileImage', base64);
                    const headerImg = document.getElementById('header-profile-img');
                    if (headerImg) headerImg.src = base64;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const userJson = localStorage.getItem('user');
            if (!userJson) return;
            const user = JSON.parse(userJson);
            
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd.entries());
            data.username = user.username;
            data.profileImage = localStorage.getItem('profileImage');

            const res = await fetch('/api/users/profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) {
                // Update local cache
                user.firstName = data.firstName;
                user.lastName = data.lastName;
                user.profileImage = data.profileImage;
                localStorage.setItem('user', JSON.stringify(user));
                
                window.showNotification('Profile updated.', 'success');
                setTimeout(() => location.reload(), 1500);
            } else {
                window.showNotification('Could not save profile data.', 'error');
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const userJson = localStorage.getItem('user');
            if (!userJson) {
                location.href = '/login';
                return;
            }
            const sessionUser = JSON.parse(userJson);
            const username = sessionUser.username;

            try {
                const res = await fetch(`/api/users/profile/${username}`);
                if (res.ok) {
                    const user = await res.json();
                    const form = document.getElementById('profile-form');
                    form.email.value = user.email || '';
                    form.firstName.value = user.firstName || '';
                    form.lastName.value = user.lastName || '';
                    form.role.value = (user.role && user.role.name) ? user.role.name : 'OPERATOR';
                    form.address.value = user.address || '';
                    form.qualification.value = user.qualification || '';
                    if (user.profileImage) {
                        document.getElementById('profile-preview').src = user.profileImage;
                        localStorage.setItem('profileImage', user.profileImage);
                    }
                }
            } catch (e) {
                console.error('Profile fetch failed', e);
            }
        });
    </script>
</body>
</html>
