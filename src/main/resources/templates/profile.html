<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | My Profile</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #262626; }
        ::-webkit-scrollbar-thumb:hover { background: #39FF14; }
        html, body { height: auto; min-height: 100%; background: black; color: white; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; min-height: 100vh; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#39FF14", "surface": "#0e0e0e", "on-surface": "#ffffff",
                "surface-container-low": "#131313", "error": "#ff7351",
              },
              fontFamily: { "headline": ["Space Grotesk"], "body": ["Inter"] }
            }
          }
        }
    </script>
</head>
<body class="bg-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20">
        <div class="max-w-2xl mx-auto">
            <div class="mb-12">
                <div class="flex items-center gap-3 mb-2">
                    <span class="h-[1px] w-12 bg-[#39FF14]"></span>
                    <span class="text-[10px] text-[#39FF14] uppercase tracking-[0.3em] font-black">Authorized Access</span>
                </div>
                <h1 class="font-headline text-5xl font-black uppercase text-white tracking-tighter leading-none mb-2">
                    Hello, <span id="display-username" class="text-[#39FF14] drop-shadow-[0_0_15px_rgba(57,255,20,0.4)]">...</span>
                </h1>
                <p class="text-neutral-500 font-label text-xs uppercase tracking-widest font-bold">System Auditor & Security Professional</p>
            </div>
            
            <div class="bg-[#131313] border border-neutral-900 p-10 rounded-sm shadow-2xl relative overflow-hidden group">
                <!-- Decorative background elements -->
                <div class="absolute top-0 right-0 w-32 h-32 bg-[#39FF14]/5 -mr-16 -mt-16 rounded-full blur-3xl group-hover:bg-[#39FF14]/10 transition-all"></div>
                
                <div class="flex flex-col items-center mb-12 relative z-10">
                    <div class="relative cursor-pointer group" onclick="document.getElementById('img-upload').click()">
                        <img id="profile-preview" class="w-32 h-32 rounded-full border-2 border-[#39FF14]/20 object-cover group-hover:border-[#39FF14] transition-all" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAr7e2o-BtyJZ7Y_xVKPl6XoYky985WrO4JKV4yLl8WDiOFf4PQ5JDGd5vKTQD2Xps-2qM5eFUTH92zoxgfd0N8ugIQhBTVgecR5nNfLiDIC9WiL7GCaNqBe-YF81ukDt5L08_uikMr4_6G2fcc1cE2QmoU8F7GFi5z7qnP1TKiSSFG7zY859tudWDbInnPgrFcFrrAVCBFQTAy2c9OXp9uIQG3fyV1gt5n_ebNU8iizSMTZTQLAa5XGM3It2v-s7xOtYVmZaoU6_BQ">
                        <div class="absolute inset-0 flex items-center justify-center bg-black/50 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-white">upload</span>
                        </div>
                    </div>
                    <input type="file" id="img-upload" class="hidden" accept="image/*" onchange="previewImage(this)">
                    <p class="text-[8px] font-label text-neutral-500 uppercase tracking-widest mt-4">Click avatar to update</p>
                </div>

                <form id="profile-form" class="space-y-6">
                    <div>
                        <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest mb-2 font-bold">Email Address</label>
                        <input type="email" name="email" readonly class="w-full bg-black/50 border border-neutral-800 text-neutral-500 p-3 text-sm outline-none cursor-not-allowed">
                    </div>
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest mb-2 font-bold">First Name</label>
                            <input type="text" name="firstName" required class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none">
                        </div>
                        <div>
                            <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest mb-2 font-bold">Last Name</label>
                            <input type="text" name="lastName" required class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest mb-2 font-bold">Role / Designation</label>
                        <input type="text" name="role" readonly class="w-full bg-black/50 border border-neutral-800 text-neutral-500 p-3 text-sm outline-none cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest mb-2 font-bold">Location / Address</label>
                        <textarea name="address" rows="2" class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none"></textarea>
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest font-bold">Professional Qualifications</label>
                            <span class="text-[8px] text-neutral-500 uppercase font-bold tracking-tighter">Will be displayed in reports</span>
                        </div>
                        <textarea name="qualification" rows="3" class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none" placeholder="e.g. OSCP, CISSP, CEH..."></textarea>
                    </div>
                    <div class="pt-6">
                        <button type="submit" class="w-full bg-[#39FF14] text-black font-headline font-black py-4 uppercase text-xs tracking-widest hover:opacity-90 transition-all shadow-lg">Save Profile Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const base64 = e.target.result;
                    document.getElementById('profile-preview').src = base64;
                    localStorage.setItem('profileImage', base64);
                    const headerImg = document.getElementById('header-profile-img');
                    if (headerImg) headerImg.src = base64;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd.entries());
            data.username = localStorage.getItem('token');
            data.profileImage = localStorage.getItem('profileImage');

            const res = await fetch('/api/users/profile', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) {
                localStorage.setItem('firstName', data.firstName);
                localStorage.setItem('lastName', data.lastName);
                localStorage.setItem('address', data.address);
                localStorage.setItem('qualification', data.qualification);
                window.showNotification('Profile attributes synchronized.', 'success');
                setTimeout(() => location.reload(), 1500);
            } else {
                window.showNotification('Could not synchronize profile data.', 'error');
            }
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const username = localStorage.getItem('token');
            if (!username) {
                location.href = '/login';
                return;
            }

            document.getElementById('display-username').textContent = username;

            try {
                const res = await fetch(`/api/users/profile/${username}`);
                if (res.ok) {
                    const user = await res.json();
                    const form = document.getElementById('profile-form');
                    form.email.value = user.email || '';
                    form.firstName.value = user.firstName || '';
                    form.lastName.value = user.lastName || '';
                    form.role.value = user.role || '';
                    form.address.value = user.address || '';
                    form.qualification.value = user.qualification || '';
                    if (user.profileImage) {
                        document.getElementById('profile-preview').src = user.profileImage;
                        localStorage.setItem('profileImage', user.profileImage);
                    }
                }
            } catch (e) {
                const form = document.getElementById('profile-form');
                form.email.value = localStorage.getItem('email') || '';
                form.firstName.value = localStorage.getItem('firstName') || '';
                form.lastName.value = localStorage.getItem('lastName') || '';
                form.role.value = localStorage.getItem('role') || '';
                form.address.value = localStorage.getItem('address') || '';
                const img = localStorage.getItem('profileImage');
                if(img) document.getElementById('profile-preview').src = img;
            }
        });
    </script>
</body>
</html>
