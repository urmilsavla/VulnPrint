<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Reset Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #000000; }
        ::-webkit-scrollbar-thumb { background: #262626; }
        ::-webkit-scrollbar-thumb:hover { background: #39FF14; }
        html, body { height: auto; min-height: 100%; background: black; color: white; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; min-height: 100vh; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#39FF14", "surface": "#0e0e0e", "on-surface": "#ffffff",
                "surface-container-low": "#131313", "error": "#ff7351",
              },
              fontFamily: { "headline": ["Space Grotesk"], "body": ["Inter"] }
            }
          }
        }
    </script>
</head>
<body class="bg-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20 flex items-center justify-center">
        <div class="w-full max-w-md">
            <div class="mb-12 text-center">
                <div class="flex items-center justify-center gap-3 mb-2">
                    <span class="h-[1px] w-12 bg-[#39FF14]"></span>
                    <span class="text-[10px] text-[#39FF14] uppercase tracking-[0.3em] font-black">Security Node</span>
                    <span class="h-[1px] w-12 bg-[#39FF14]"></span>
                </div>
                <h1 class="font-headline text-4xl font-black uppercase text-white tracking-tighter leading-none mb-2">Credential Reset</h1>
                <p class="text-neutral-500 font-label text-xs uppercase tracking-widest font-bold">Secure Access Restoration Point</p>
            </div>

            <div class="bg-[#131313] border border-neutral-900 p-10 rounded-sm shadow-2xl">
                <form id="reset-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest font-bold">Current Passcode</label>
                        <input type="password" name="currentPassword" required class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest font-bold">New Passcode</label>
                        <input type="password" name="newPassword" required class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-label text-[#39FF14]/60 uppercase tracking-widest font-bold">Confirm New Passcode</label>
                        <input type="password" id="confirmPassword" required class="w-full bg-black border border-neutral-800 text-white p-3 text-sm focus:border-[#39FF14] outline-none">
                    </div>
                    <div class="pt-6">
                        <button type="submit" class="w-full bg-[#39FF14] text-black font-headline font-black py-4 uppercase text-xs tracking-widest hover:opacity-90 transition-all shadow-lg">Execute Update</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('reset-form').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd.entries());
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (data.newPassword !== confirmPwd) {
                window.showNotification('Validation Error: Passcode mismatch detected.', 'error');
                return;
            }

            data.username = localStorage.getItem('token');

            const res = await fetch('/api/users/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                window.showNotification('Security credentials updated successfully.', 'success');
                setTimeout(() => location.href = '/profile', 1500);
            } else {
                window.showNotification(result.message || 'System Error: Update operation failed.', 'error');
            }
        };
    </script>
</body>
</html>
