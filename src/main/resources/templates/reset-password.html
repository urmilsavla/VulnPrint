<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Security Reset</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex items-center justify-center min-h-screen p-4 pt-24">
        <div class="panel-terminal w-full max-w-lg p-10 relative overflow-hidden">
            <div class="corner-accent"></div>
            
            <div id="reset-form-container">
                <div class="text-center mb-10">
                    <div class="w-16 h-16 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                        <span class="material-symbols-outlined text-primary text-3xl">lock_reset</span>
                    </div>
                    <h1 class="heading-main mb-2">Security Override</h1>
                    <p class="text-[10px] text-neutral-500 uppercase tracking-[0.2em] font-bold">Update System Credentials</p>
                </div>

                <form id="reset-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block label-sub ml-1">New System Password *</label>
                        <input type="password" id="password" name="newPassword" required oninput="evaluatePassword(this.value)" class="input-terminal" placeholder="Enter new password">
                        
                        <div class="mt-4 p-4 bg-black/40 rounded-xl border border-neutral-900">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-[9px] font-black uppercase text-neutral-500 tracking-widest font-headline">Complexity Analysis</span>
                                <span id="pwd-strength-text" class="text-[9px] font-black uppercase tracking-widest text-neutral-500 font-headline">None</span>
                            </div>
                            <div class="flex gap-1 h-1 mb-4">
                                <div id="bar-1" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-2" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-3" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-4" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-[9px] font-bold text-neutral-600 uppercase tracking-widest font-headline">
                                <div class="flex items-center gap-1 transition-colors" id="req-length"><span class="material-symbols-outlined text-[10px]">close</span> 8+ Characters</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-upper"><span class="material-symbols-outlined text-[10px]">close</span> 1 Uppercase</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-lower"><span class="material-symbols-outlined text-[10px]">close</span> 1 Lowercase</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-num"><span class="material-symbols-outlined text-[10px]">close</span> 1 Number</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-spec"><span class="material-symbols-outlined text-[10px]">close</span> 1 Special Char</div>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block label-sub ml-1">Confirm New Password *</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required class="input-terminal" placeholder="Confirm new password">
                    </div>
                    <div class="pt-8">
                        <button type="submit" id="submit-btn" class="btn-primary w-full py-4">Execute Update</button>
                    </div>
                </form>
            </div>

            <div id="success-container" class="hidden text-center py-10">
                <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="material-symbols-outlined text-primary text-5xl">verified_user</span>
                </div>
                <h2 class="text-xl font-headline font-black text-white uppercase mb-2">Credentials Updated</h2>
                <p class="text-neutral-400 text-[10px] uppercase tracking-widest font-bold mb-8">All active sessions have been purged. <br>Please sign in with your new password.</p>
                <a href="/login" class="btn-primary inline-block px-10">Sign In</a>
            </div>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            window.showNotification('Security Error: Invalid or missing token.', 'error');
            setTimeout(() => window.location.href = '/login', 3000);
        }

        function evaluatePassword(pwd) {
            let strength = 0;
            const reqs = {
                length: pwd.length >= 8,
                upper: /[A-Z]/.test(pwd),
                lower: /[a-z]/.test(pwd),
                num: /[0-9]/.test(pwd),
                spec: /[^A-Za-z0-9]/.test(pwd)
            };

            if (reqs.length) strength++;
            if (reqs.upper) strength++;
            if (reqs.lower) strength++;
            if (reqs.num) strength++;
            if (reqs.spec) strength++;

            const updateReq = (id, met) => {
                const el = document.getElementById(id);
                if (met) {
                    el.classList.remove('text-neutral-600');
                    el.classList.add('text-primary');
                    el.querySelector('span').innerText = 'check';
                } else {
                    el.classList.remove('text-primary');
                    el.classList.add('text-neutral-600');
                    el.querySelector('span').innerText = 'close';
                }
            };

            updateReq('req-length', reqs.length);
            updateReq('req-upper', reqs.upper);
            updateReq('req-lower', reqs.lower);
            updateReq('req-num', reqs.num);
            updateReq('req-spec', reqs.spec);

            const bars = [document.getElementById('bar-1'), document.getElementById('bar-2'), document.getElementById('bar-3'), document.getElementById('bar-4')];
            bars.forEach(b => b.className = 'flex-1 bg-neutral-800 rounded-full transition-all');
            
            const textEl = document.getElementById('pwd-strength-text');
            
            if (pwd.length === 0) {
                textEl.innerText = 'None';
                textEl.className = 'text-[9px] font-black uppercase tracking-widest text-neutral-500 font-headline';
            } else if (strength <= 3) {
                bars[0].classList.add('bg-error');
                if (strength >= 2) bars[1].classList.add('bg-error');
                textEl.innerText = 'Weak';
                textEl.className = 'text-[9px] font-black uppercase tracking-widest text-error font-headline';
            } else if (strength === 4) {
                bars[0].classList.add('bg-orange-500');
                bars[1].classList.add('bg-orange-500');
                bars[2].classList.add('bg-orange-500');
                textEl.innerText = 'Good';
                textEl.className = 'text-[9px] font-black uppercase tracking-widest text-orange-500 font-headline';
            } else if (strength === 5) {
                bars.forEach(b => b.classList.add('bg-primary'));
                textEl.innerText = 'Strong';
                textEl.className = 'text-[9px] font-black uppercase tracking-widest text-primary font-headline';
            }
            
            return strength === 5;
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!evaluatePassword(password)) {
                window.showNotification('Complexity requirements not met.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                window.showNotification('Passwords do not match.', 'error');
                return;
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'EXECUTING SECURITY UPDATE...';

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword: password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.clear();
                    document.getElementById('reset-form-container').classList.add('hidden');
                    document.getElementById('success-container').classList.remove('hidden');
                    window.showNotification('Security credentials updated successfully.', 'success');
                } else {
                    window.showNotification(data.message || 'Reset failed.', 'error');
                }
            } catch (e) {
                window.showNotification('System Error: Service unavailable.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Execute Update';
            }
        });
    </script>
</body>
</html>
