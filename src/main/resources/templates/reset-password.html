<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Reset Password</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { headline: ['Space Grotesk'], body: ['Inter'], label: ['Space Grotesk'] }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }

        .tile-card { background: rgba(19, 19, 19, 0.4); border: 1px solid #262626; transition: all 0.3s ease; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4FFE49; }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20 flex items-center justify-center min-h-[calc(100vh-100px)]">
        <div class="w-full max-w-md">
            <div class="mb-12 text-center">
                <h1 class="text-3xl font-bold text-white uppercase tracking-tight">Reset Password</h1>
                <p class="text-neutral-400 mt-1">Execute security credential update</p>
            </div>

            <div class="tile-card p-10 rounded-xl shadow-2xl">
                <div class="flex items-center justify-center gap-3 mb-10 text-white">
                    <span class="material-symbols-outlined text-primary text-3xl">key</span>
                    <h2 class="text-xl font-bold uppercase tracking-tight">Credential Update</h2>
                </div>

                <form id="reset-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest font-black">Current Password *</label>
                        <input type="password" name="currentPassword" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest font-black">New Password *</label>
                        <input type="password" name="newPassword" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-label text-primary/60 uppercase tracking-widest font-black">Confirm New Password *</label>
                        <input type="password" id="confirmPassword" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg">
                    </div>
                    <div class="pt-8">
                        <button type="submit" class="w-full bg-primary text-black font-bold py-4 uppercase text-[11px] tracking-widest hover:opacity-90 transition-all shadow-lg rounded-lg">Update Password</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('reset-form').onsubmit = async (e) => {
            e.preventDefault();
            const userJson = localStorage.getItem('user');
            if (!userJson) return;
            const sessionUser = JSON.parse(userJson);
            
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd.entries());
            const confirmPwd = document.getElementById('confirmPassword').value;

            if (data.newPassword !== confirmPwd) {
                if (window.showNotification) window.showNotification('The new passwords do not match.', 'error');
                return;
            }

            data.username = sessionUser.username;

            const res = await fetch('/api/users/change-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await res.json();
            if (res.ok) {
                if (window.showNotification) window.showNotification('Your password has been changed successfully.', 'success');
                setTimeout(() => location.href = '/profile', 1500);
            } else {
                if (window.showNotification) window.showNotification(result.message || 'Failed to update password.', 'error');
            }
        };
    </script>
</body>
</html>
