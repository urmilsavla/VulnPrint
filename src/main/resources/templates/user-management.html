<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | User Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#0e0e0e",
                        "surface-container-low": "#131313",
                        "surface-container-high": "#1f1f1f",
                        "surface-container-highest": "#262626",
                        "primary": "#39FF14",
                        "error": "#ff7351",
                        "outline-variant": "#484848"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"]
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
            vertical-align: middle;
        }
        body { background-color: #0e0e0e; color: #ffffff; font-family: 'Inter', sans-serif; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; min-height: 100vh; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
    </style>
</head>
<body class="bg-black">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20">
        <div class="flex justify-between items-end mb-8 border-b border-neutral-900 pb-6">
            <div>
                <h1 class="text-2xl font-headline font-bold text-white tracking-tight uppercase">User Management</h1>
                <p class="text-[10px] font-mono tracking-[0.3em] text-neutral-500 mt-1 uppercase">System Administration // User Registry</p>
            </div>
            <button onclick="openModal()" class="px-6 py-2 bg-white text-black font-headline font-black text-[10px] uppercase tracking-widest hover:opacity-90 transition-colors">Add New User</button>
        </div>

        <!-- Users Table -->
        <section class="bg-surface-container-low border border-outline-variant/10">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-surface-container-high/50 border-b border-outline-variant/10">
                            <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-semibold text-zinc-500">User</th>
                            <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-semibold text-zinc-500">Email</th>
                            <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-semibold text-zinc-500">Role</th>
                            <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-semibold text-zinc-500">Address</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-outline-variant/10" id="user-table-body">
                        <!-- Dynamic rows -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Add User Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
        <div class="bg-surface-container-low border border-neutral-800 w-full max-w-md p-8 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-zinc-500 hover:text-white"><span class="material-symbols-outlined">close</span></button>
            <h2 class="text-xl font-headline font-bold text-white mb-6 uppercase tracking-tight">Register New User</h2>
            
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-[9px] uppercase tracking-widest font-black text-zinc-500 mb-1">Username</label>
                    <input type="text" name="username" required class="w-full bg-black border border-neutral-800 text-white p-2.5 text-sm outline-none focus:border-white transition-colors">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[9px] uppercase tracking-widest font-black text-zinc-500 mb-1">First Name</label>
                        <input type="text" name="firstName" required class="w-full bg-black border border-neutral-800 text-white p-2.5 text-sm outline-none focus:border-white transition-colors">
                    </div>
                    <div>
                        <label class="block text-[9px] uppercase tracking-widest font-black text-zinc-500 mb-1">Last Name</label>
                        <input type="text" name="lastName" required class="w-full bg-black border border-neutral-800 text-white p-2.5 text-sm outline-none focus:border-white transition-colors">
                    </div>
                </div>
                <div>
                    <label class="block text-[9px] uppercase tracking-widest font-black text-zinc-500 mb-1">Email</label>
                    <input type="email" name="email" required class="w-full bg-black border border-neutral-800 text-white p-2.5 text-sm outline-none focus:border-white transition-colors">
                </div>
                <div>
                    <label class="block text-[9px] uppercase tracking-widest font-black text-zinc-500 mb-1">Password</label>
                    <input type="password" name="password" required class="w-full bg-black border border-neutral-800 text-white p-2.5 text-sm outline-none focus:border-white transition-colors">
                </div>
                <div>
                    <label class="block text-[9px] uppercase tracking-widest font-black text-zinc-500 mb-1">Role</label>
                    <select name="role" class="w-full bg-black border border-neutral-800 text-white p-2.5 text-sm outline-none focus:border-white transition-colors">
                        <option value="Pentester">Pentester</option>
                        <option value="Administrator">Administrator</option>
                    </select>
                </div>
                <div class="pt-4">
                    <button type="submit" class="w-full bg-white text-black font-headline font-black py-3 uppercase text-[10px] tracking-widest hover:opacity-90 transition-colors">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('user-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('user-modal').classList.add('hidden'); }

        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = users.map(u => `
                <tr class="hover:bg-white/[0.02] transition-colors">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img src="${u.profileImage || 'https://lh3.googleusercontent.com/aida-public/AB6AXuAr7e2o-BtyJZ7Y_xVKPl6XoYky985WrO4JKV4yLl8WDiOFf4PQ5JDGd5vKTQD2Xps-2qM5eFUTH92zoxgfd0N8ugIQhBTVgecR5nNfLiDIC9WiL7GCaNqBe-YF81ukDt5L08_uikMr4_6G2fcc1cE2QmoU8F7GFi5z7qnP1TKiSSFG7zY859tudWDbInnPgrFcFrrAVCBFQTAy2c9OXp9uIQG3fyV1gt5n_ebNU8iizSMTZTQLAa5XGM3It2v-s7xOtYVmZaoU6_BQ'}" class="w-8 h-8 rounded-full border border-neutral-800 object-cover">
                            <div>
                                <p class="text-xs font-bold text-white">${u.firstName} ${u.lastName}</p>
                                <p class="text-[9px] text-zinc-500 font-mono">@${u.username}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs text-zinc-400 font-mono">${u.email}</td>
                    <td class="px-6 py-4 text-[10px] uppercase font-bold text-zinc-300">
                        <span class="px-2 py-0.5 border border-zinc-700 bg-zinc-900">${u.role}</span>
                    </td>
                    <td class="px-6 py-4 text-xs text-zinc-500">${u.address || 'N/A'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                window.showNotification('User created successfully.', 'success');
                closeModal();
                loadUsers();
            } else {
                const err = await res.json();
                window.showNotification(err.message || 'Failed to create user.', 'error');
            }
        };

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
