<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | Manage Users</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { headline: ['Space Grotesk'], body: ['Inter'], label: ['Space Grotesk'] }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }

        .tile-card { background: rgba(19, 19, 19, 0.4); border: 1px solid #262626; transition: all 0.3s ease; }
        .tile-header { cursor: pointer; }
        .tile-content { max-height: 5000px; overflow: visible; transition: all 0.5s cubic-bezier(0, 1, 0, 1); }
        .collapse-icon { transition: transform 0.3s ease; color: #525252; }
        .tile-card.collapsed .tile-content { max-height: 0; opacity: 0; padding: 0 !important; margin: 0 !important; overflow: hidden; pointer-events: none; }
        .tile-card.collapsed .collapse-icon { transform: rotate(-90deg); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4FFE49; }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-12 border-b border-neutral-800 pb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white uppercase">Manage Users</h1>
                    <p class="text-neutral-400 mt-1">Configure system users and access roles</p>
                </div>
                <button onclick="openModal()" class="px-8 py-2 bg-primary text-black font-bold text-xs uppercase tracking-wider hover:opacity-90 shadow-lg">Add New User</button>
            </div>

            <!-- User Registry Tile -->
            <div class="tile-card p-8 rounded-xl shadow-2xl" id="tile-registry">
                <div class="tile-header flex justify-between items-center mb-8 text-white" onclick="toggleTile('tile-registry')">
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-primary text-3xl">group</span>
                        <h2 class="text-xl font-bold">User Registry</h2>
                    </div>
                    <span class="material-symbols-outlined collapse-icon">expand_more</span>
                </div>
                <div class="tile-content">
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-neutral-800">
                                    <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-black text-neutral-500">User</th>
                                    <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-black text-neutral-500">Email</th>
                                    <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-black text-neutral-500">Role</th>
                                    <th class="px-6 py-4 text-[10px] uppercase tracking-[0.2em] font-black text-neutral-500">Address</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-neutral-900" id="user-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Add User Modal -->
    <div id="user-modal" class="fixed inset-0 bg-black/90 backdrop-blur-xl z-[100] hidden flex items-center justify-center p-4">
        <div class="tile-card border border-neutral-800 w-full max-w-md p-8 relative rounded-2xl shadow-3xl">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-neutral-500 hover:text-white transition-colors"><span class="material-symbols-outlined">close</span></button>
            <div class="flex items-center gap-3 mb-8">
                <span class="material-symbols-outlined text-primary">person_add</span>
                <h2 class="text-xl font-bold text-white uppercase tracking-tight">Register New User</h2>
            </div>
            
            <form id="register-form" class="space-y-6">
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-black text-primary/60 mb-2">Username</label>
                    <input type="text" name="username" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm outline-none focus:border-primary transition-colors rounded-lg">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest font-black text-primary/60 mb-2">First Name</label>
                        <input type="text" name="firstName" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm outline-none focus:border-primary transition-colors rounded-lg">
                    </div>
                    <div>
                        <label class="block text-[10px] uppercase tracking-widest font-black text-primary/60 mb-2">Last Name</label>
                        <input type="text" name="lastName" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm outline-none focus:border-primary transition-colors rounded-lg">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-black text-primary/60 mb-2">Email</label>
                    <input type="email" name="email" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm outline-none focus:border-primary transition-colors rounded-lg">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-black text-primary/60 mb-2">Password</label>
                    <input type="password" name="password" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm outline-none focus:border-primary transition-colors rounded-lg">
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-widest font-black text-primary/60 mb-2">Role</label>
                    <select name="role" class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm outline-none focus:border-primary transition-colors rounded-lg">
                        <option value="Pentester">Pentester</option>
                        <option value="Administrator">Administrator</option>
                    </select>
                </div>
                <div class="pt-6">
                    <button type="submit" class="w-full bg-primary text-black font-bold py-4 uppercase text-[11px] tracking-widest hover:opacity-90 transition-colors shadow-lg rounded-lg">Create User Account</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleTile(tileId) {
            const tile = document.getElementById(tileId);
            tile.classList.toggle('collapsed');
        }

        function openModal() { document.getElementById('user-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('user-modal').classList.add('hidden'); }

        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = users.map(u => `
                <tr class="hover:bg-white/[0.02] transition-colors group">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <img src="${u.profileImage || 'https://lh3.googleusercontent.com/aida-public/AB6AXuAr7e2o-BtyJZ7Y_xVKPl6XoYky985WrO4JKV4yLl8WDiOFf4PQ5JDGd5vKTQD2Xps-2qM5eFUTH92zoxgfd0N8ugIQhBTVgecR5nNfLiDIC9WiL7GCaNqBe-YF81ukDt5L08_uikMr4_6G2fcc1cE2QmoU8F7GFi5z7qnP1TKiSSFG7zY859tudWDbInnPgrFcFrrAVCBFQTAy2c9OXp9uIQG3fyV1gt5n_ebNU8iizSMTZTQLAa5XGM3It2v-s7xOtYVmZaoU6_BQ'}" class="w-10 h-10 rounded-full border border-neutral-800 object-cover group-hover:border-primary/50 transition-colors">
                            <div>
                                <p class="text-xs font-bold text-white">${u.firstName} ${u.lastName}</p>
                                <p class="text-[9px] text-neutral-500 font-mono tracking-wider">@${u.username}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-xs text-neutral-400 font-mono">${u.email}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 text-[10px] uppercase font-black tracking-widest border border-neutral-800 bg-neutral-900/50 text-neutral-400 rounded">${u.role}</span>
                    </td>
                    <td class="px-6 py-4 text-xs text-neutral-500">${u.address || 'N/A'}</td>
                </tr>
            `).join('');
        }

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                window.showNotification('User node initialized successfully.', 'success');
                closeModal();
                loadUsers();
            } else {
                const err = await res.json();
                window.showNotification(err.message || 'Node synchronization failed.', 'error');
            }
        };

        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
