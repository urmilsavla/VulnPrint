<!DOCTYPE html>
<html class="dark" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>VulnPrint | User Management</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { headline: ['Space Grotesk'], body: ['Inter'] }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; font-family: 'Inter', sans-serif; }
        #main-content { padding-top: 100px; margin-left: 64px; transition: margin-left 0.3s ease; }
        body.sidebar-expanded #main-content { margin-left: 256px; }
        body.sidebar-expanded #header { left: 256px; }
        @media (max-width: 1024px) { #main-content { margin-left: 0 !important; } }

        .tile-card { background: rgba(19, 19, 19, 0.4) !important; border: 1px solid #262626 !important; transition: all 0.3s ease; backdrop-filter: blur(12px); }
        .tile-header { cursor: pointer; }
        .tile-content { max-height: 2000px; overflow: visible; transition: all 0.5s cubic-bezier(0, 1, 0, 1); }
        .collapse-icon { transition: transform 0.3s ease; color: #525252; }
        .tile-card.collapsed .tile-content { max-height: 0; opacity: 0; padding: 0 !important; margin: 0 !important; overflow: hidden; pointer-events: none; }
        .tile-card.collapsed .collapse-icon { transform: rotate(-90deg); }
        
        /* Status Toggle */
        .status-toggle {
            width: 32px; height: 18px; background: #333; border-radius: 20px; position: relative; cursor: pointer; transition: all 0.3s;
        }
        .status-toggle::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; background: #666; border-radius: 50%; transition: all 0.3s;
        }
        .status-toggle.active { background: rgba(79, 254, 73, 0.2); }
        .status-toggle.active::after { left: 16px; background: #4FFE49; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4FFE49; }

        .validation-msg { font-size: 9px; margin-top: 4px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body selection:bg-primary selection:text-black">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/header :: header}"></div>

    <main id="main-content" class="px-8 pb-20">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-12 border-b border-neutral-800 pb-8">
                <div>
                    <h1 class="text-3xl font-bold text-white uppercase tracking-tight headline">System Users</h1>
                    <p class="text-neutral-400 mt-1 uppercase text-[10px] font-bold tracking-widest">Manage users and their roles</p>
                </div>
            </div>

            <div class="space-y-10">
                <!-- Add/Edit User Tile -->
                <div class="tile-card p-8 rounded-xl shadow-2xl collapsed" id="form-tile">
                    <div class="tile-header flex justify-between items-center mb-0 text-white" onclick="toggleAddForm()">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-primary text-3xl" id="form-icon">person_add</span>
                            <h2 class="text-xl font-bold uppercase headline" id="form-title">Add New User</h2>
                        </div>
                        <span class="material-symbols-outlined collapse-icon">expand_more</span>
                    </div>
                    
                    <div class="tile-content mt-8">
                        <form id="user-form" class="space-y-6">
                            <input type="hidden" id="form-user-id">
                            
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1">Username *</label>
                                    <input type="text" id="form-username" required oninput="checkUsername(this.value)" class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm focus:border-primary outline-none transition-colors rounded-lg font-mono" placeholder="e.g. j.doe">
                                    <p id="username-validation" class="validation-msg hidden"></p>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1">Email *</label>
                                    <input type="email" id="form-email" required oninput="checkEmail(this.value)" class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm focus:border-primary outline-none transition-colors rounded-lg font-mono" placeholder="e.g. j.doe@vulnprint.local">
                                    <p id="email-validation" class="validation-msg hidden"></p>
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1">Role *</label>
                                    <select id="form-role" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm focus:border-primary outline-none transition-colors rounded-lg uppercase tracking-wider">
                                        <!-- Roles populated via JS -->
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1">First Name *</label>
                                    <input type="text" id="form-first-name" required class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm focus:border-primary outline-none transition-colors rounded-lg" placeholder="e.g. John">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1">Last Name *</label>
                                    <input type="text" id="form-last-name" required class="input-terminal !bg-black/40" placeholder="e.g. Doe">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4 border-t border-neutral-800/50">
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1" id="pass-label">Password</label>
                                    <input type="password" id="form-password" oninput="validatePasswords()" class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm focus:border-primary outline-none transition-colors rounded-lg font-mono" placeholder="••••••••">
                                </div>
                                <div class="space-y-2">
                                    <label class="text-[10px] uppercase font-bold text-neutral-500 tracking-widest ml-1">Confirm Password</label>
                                    <input type="password" id="form-confirm-password" oninput="validatePasswords()" class="w-full bg-black/60 border border-neutral-800 text-white p-3 text-sm focus:border-primary outline-none transition-colors rounded-lg font-mono" placeholder="••••••••">
                                    <p id="password-validation" class="validation-msg hidden"></p>
                                </div>
                            </div>
                            
                            <div class="pt-4 flex justify-end gap-4">
                                <button type="button" onclick="resetForm()" class="px-8 py-3 border border-neutral-800 text-neutral-500 font-bold uppercase text-[10px] tracking-widest hover:text-white transition-colors rounded">Cancel</button>
                                <button type="submit" class="px-12 py-3 bg-primary text-black font-bold uppercase text-[10px] tracking-widest hover:opacity-90 transition-colors shadow-lg rounded disabled:opacity-50" id="submit-btn">Save User</button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- User List Tile -->
                <div class="tile-card p-8 rounded-xl shadow-2xl">
                    <div class="flex justify-between items-center mb-8 text-white">
                        <div class="flex items-center gap-4">
                            <span class="material-symbols-outlined text-primary text-3xl">group</span>
                            <h2 class="text-xl font-bold uppercase headline">User List</h2>
                        </div>
                        <div class="relative">
                            <input type="text" id="user-search" oninput="renderUsers(this.value)" placeholder="Search..." class="bg-black/40 border border-neutral-800 text-[10px] uppercase tracking-widest py-3 pl-10 w-64 text-neutral-300 focus:border-primary outline-none transition-all rounded-lg">
                            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-neutral-600 text-sm">search</span>
                        </div>
                    </div>

                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-neutral-800 text-[10px] uppercase tracking-widest font-bold text-neutral-500">
                                    <th class="px-6 py-4">User</th>
                                    <th class="px-6 py-4">Role</th>
                                    <th class="px-6 py-4 text-center">Status</th>
                                    <th class="px-6 py-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-neutral-900" id="user-table-body">
                                <!-- Dynamic rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let allUsers = [];
        let allRoles = [];
        let isEditMode = false;
        let originalUsername = '';

        async function init() {
            await Promise.all([loadRoles(), loadUsers()]);
        }

        function toggleAddForm() {
            const tile = document.getElementById('form-tile');
            tile.classList.toggle('collapsed');
        }

        async function loadRoles() {
            try {
                const res = await fetch('/api/users/roles');
                allRoles = await res.json();
                const select = document.getElementById('form-role');
                select.innerHTML = '<option value="">SELECT ROLE...</option>' + 
                    allRoles.map(r => `<option value="${r.id}">${r.name}</option>`).join('');
            } catch (err) { console.error('Role refresh failed:', err); }
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                allUsers = await res.json();
                renderUsers();
            } catch (err) { console.error('User refresh failed:', err); }
        }

        function renderUsers(filter = '') {
            const tbody = document.getElementById('user-table-body');
            const canManage = window.hasPermission('MANAGE_USERS');
            
            const filtered = allUsers.filter(u => 
                u.username.toLowerCase().includes(filter.toLowerCase()) || 
                u.firstName.toLowerCase().includes(filter.toLowerCase()) || 
                u.lastName.toLowerCase().includes(filter.toLowerCase()) ||
                u.email.toLowerCase().includes(filter.toLowerCase())
            );

            tbody.innerHTML = filtered.map(u => {
                const isSelf = localStorage.getItem('username') === u.username;
                const isAdmin = u.username === 'admin';
                return `
                <tr class="hover:bg-white/[0.02] transition-colors group">
                    <td class="px-6 py-5">
                        <div class="flex items-center gap-4">
                            <img src="${u.profileImage || '/images/user.png'}" class="w-10 h-10 rounded-lg border border-neutral-800 object-cover grayscale group-hover:grayscale-0 transition-all">
                            <div>
                                <p class="text-sm font-bold text-white uppercase tracking-tight headline">${u.firstName} ${u.lastName}</p>
                                <p class="text-[10px] text-neutral-500 font-bold uppercase tracking-widest mt-0.5">@${u.username}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5">
                        <span class="px-3 py-1 text-[9px] uppercase font-black tracking-widest border border-neutral-800 bg-neutral-900/50 text-primary rounded">${u.role ? u.role.name : 'NONE'}</span>
                    </td>
                    <td class="px-6 py-5">
                        <div class="flex items-center justify-center gap-3">
                            <span class="text-[8px] font-black uppercase tracking-tighter ${u.enabled ? 'text-primary' : 'text-neutral-600'}">${u.enabled ? 'Active' : 'Inactive'}</span>
                            <div class="status-toggle ${u.enabled ? 'active' : ''} ${canManage && !isSelf && !isAdmin ? '' : 'pointer-events-none opacity-20'}" 
                                 onclick="toggleUserStatus(${u.id}, ${!u.enabled})">
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-5 text-right">
                        ${canManage ? `
                        <div class="flex items-center justify-end gap-2 text-neutral-600">
                            <button onclick='editUser(${JSON.stringify(u).replace(/'/g, "&apos;")})' 
                                    class="p-2 hover:text-primary transition-colors ${isAdmin ? 'pointer-events-none opacity-20' : ''}" 
                                    ${isAdmin ? 'disabled' : ''}>
                                <span class="material-symbols-outlined text-lg">edit</span>
                            </button>
                            <button onclick="deleteUser(${u.id})" 
                                    class="p-2 hover:text-error transition-colors ${isSelf || isAdmin ? 'pointer-events-none opacity-20' : ''}" 
                                    ${isSelf || isAdmin ? 'disabled' : ''}>
                                <span class="material-symbols-outlined text-lg">delete</span>
                            </button>
                        </div>
                        ` : '<span class="text-[10px] text-neutral-700 uppercase font-bold tracking-widest">Locked</span>'}
                    </td>
                </tr>
            `}).join('');
        }

        function editUser(user) {
            isEditMode = true;
            originalUsername = user.username;
            const tile = document.getElementById('form-tile');
            tile.classList.remove('collapsed');
            
            document.getElementById('form-title').innerText = "Edit User";
            document.getElementById('form-icon').innerText = "manage_accounts";
            document.getElementById('submit-btn').innerText = "Update User";
            document.getElementById('pass-label').innerText = "New Password (Optional)";
            
            document.getElementById('form-user-id').value = user.id;
            document.getElementById('form-username').value = user.username;
            document.getElementById('form-first-name').value = user.firstName;
            document.getElementById('form-last-name').value = user.lastName;
            document.getElementById('form-email').value = user.email;
            document.getElementById('form-role').value = user.role ? user.role.id : '';
            
            document.getElementById('form-password').required = false;
            document.getElementById('form-confirm-password').required = false;
            
            document.getElementById('username-validation').classList.add('hidden');
            document.getElementById('password-validation').classList.add('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            isEditMode = false;
            originalUsername = '';
            document.getElementById('user-form').reset();
            document.getElementById('form-title').innerText = "Add New User";
            document.getElementById('form-icon').innerText = "person_add";
            document.getElementById('submit-btn').innerText = "Save User";
            document.getElementById('pass-label').innerText = "Password";
            document.getElementById('form-user-id').value = '';
            document.getElementById('form-password').required = true;
            document.getElementById('form-confirm-password').required = true;
            
            document.getElementById('username-validation').classList.add('hidden');
            document.getElementById('password-validation').classList.add('hidden');
            document.getElementById('submit-btn').disabled = false;
            
            document.getElementById('form-tile').classList.add('collapsed');
        }

        async function checkUsername(val) {
            const el = document.getElementById('username-validation');
            const submitBtn = document.getElementById('submit-btn');
            
            if (!val || (isEditMode && val === originalUsername)) {
                el.classList.add('hidden');
                submitBtn.disabled = false;
                return;
            }

            try {
                const res = await fetch(`/api/users/check-username?username=${encodeURIComponent(val)}`);
                const data = await res.json();
                el.classList.remove('hidden');
                if (data.exists) {
                    el.innerText = "Taken";
                    el.className = "validation-msg text-error";
                    submitBtn.disabled = true;
                } else {
                    el.innerText = "Available";
                    el.className = "validation-msg text-primary";
                    submitBtn.disabled = false;
                }
            } catch (err) { console.error('Username check failed', err); }
        }

        async function checkEmail(val) {
            const el = document.getElementById('email-validation');
            const submitBtn = document.getElementById('submit-btn');
            const originalEmail = isEditMode ? allUsers.find(u => u.id == document.getElementById('form-user-id').value)?.email : '';
            
            if (!val || (isEditMode && val === originalEmail)) {
                el.classList.add('hidden');
                submitBtn.disabled = false;
                return;
            }

            try {
                const res = await fetch(`/api/users/check-email?email=${encodeURIComponent(val)}`);
                const data = await res.json();
                el.classList.remove('hidden');
                if (data.exists) {
                    el.innerText = "Email Taken";
                    el.className = "validation-msg text-error";
                    submitBtn.disabled = true;
                } else {
                    el.innerText = "Email Available";
                    el.className = "validation-msg text-primary";
                    submitBtn.disabled = false;
                }
            } catch (err) { console.error('Email check failed', err); }
        }

        function validatePasswords() {
            const pass = document.getElementById('form-password').value;
            const confirm = document.getElementById('form-confirm-password').value;
            const el = document.getElementById('password-validation');

            if (!confirm) {
                el.classList.add('hidden');
                return;
            }

            el.classList.remove('hidden');
            if (pass !== confirm) {
                el.innerText = "Mismatch";
                el.className = "validation-msg text-error";
            } else {
                el.innerText = "Match";
                el.className = "validation-msg text-primary";
            }
        }

        async function toggleUserStatus(id, enabled) {
            try {
                const res = await fetch(`/api/users/${id}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });
                if (res.ok) {
                    window.showNotification(`Account ${enabled ? 'active' : 'inactive'}`, 'success');
                    loadUsers();
                }
            } catch (err) { console.error('Status refresh failed:', err); }
        }

        async function deleteUser(id) {
            if (!(await window.askPermission('Are you sure you want to remove this user?'))) return;
            try {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    window.showNotification('The user has been removed successfully.', 'success');
                    loadUsers();
                } else {
                    const data = await res.json();
                    window.showNotification(data.message || 'Failed to remove the user.', 'error');
                }
            } catch (err) { console.error('Delete failed:', err); }
        }

        document.getElementById('user-form').onsubmit = async (e) => {
            e.preventDefault();
            const pass = document.getElementById('form-password').value;
            const confirm = document.getElementById('form-confirm-password').value;

            if ((!isEditMode || pass) && pass !== confirm) {
                window.showNotification('The passwords do not match.', 'error');
                return;
            }

            const data = {
                id: document.getElementById('form-user-id').value,
                username: document.getElementById('form-username').value,
                firstName: document.getElementById('form-first-name').value,
                lastName: document.getElementById('form-last-name').value,
                email: document.getElementById('form-email').value,
                roleId: document.getElementById('form-role').value,
                password: pass,
                confirmPassword: confirm,
                newUsername: document.getElementById('form-username').value,
                newPassword: pass
            };

            const endpoint = isEditMode ? '/api/users/profile' : '/api/users/register';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    window.showNotification(isEditMode ? 'The user details have been updated.' : 'The new user has been created successfully.', 'success');
                    resetForm();
                    loadUsers();
                } else {
                    const err = await res.json();
                    window.showNotification(err.message || 'Failed to save the user details.', 'error');
                }
            } catch (err) { console.error('Save failed:', err); }
        };

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
