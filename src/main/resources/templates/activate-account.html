<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>VulnPrint | Activate Account</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { 
                headline: ['Space Grotesk', 'sans-serif'], 
                body: ['Inter', 'sans-serif'] 
              },
              boxShadow: { terminal: "0 0 0 1px rgba(38,38,38,0.85), 0 30px 80px rgba(0,0,0,0.55)" }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; background-color: #050505; }
        .radar-bg {
            background: 
                radial-gradient(circle at top right, rgba(79, 254, 73, 0.08), transparent 40%),
                radial-gradient(circle at bottom left, rgba(136, 246, 255, 0.05), transparent 40%),
                #050505;
        }
        .tile-card { background: rgba(19, 19, 19, 0.6); border: 1px solid #262626; backdrop-filter: blur(12px); }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body flex flex-col items-center justify-center p-6">

    <!-- Notification Container -->
    <div id="notification-container" class="fixed top-8 right-8 z-[300] flex flex-col gap-4 pointer-events-none"></div>

    <main class="w-full max-w-md relative z-10">
        <!-- 1. Logo in Upper Middle -->
        <div class="mb-10 text-center">
            <img alt="VulnPrint Logo" class="h-16 mx-auto brightness-110" src="/images/logo.png">
        </div>

        <!-- 2. Centered Content Box -->
        <div class="tile-card p-10 rounded-2xl shadow-terminal relative overflow-hidden">
            <div id="activation-form-container">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-headline font-black uppercase text-white mb-2">Activate Account</h1>
                    <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Set up your account password</p>
                </div>

                <form id="activate-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">New Password</label>
                        <input type="password" id="password" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg font-body" placeholder="Enter new password">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Confirm Password</label>
                        <input type="password" id="confirmPassword" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg font-body" placeholder="Confirm new password">
                    </div>
                    <button type="submit" class="w-full bg-primary text-black font-headline font-black py-4 uppercase text-[10px] tracking-widest hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all rounded-lg mt-4">Activate Account</button>
                </form>
            </div>

            <div id="success-container" class="hidden text-center py-10">
                <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="material-symbols-outlined text-primary text-5xl">verified_user</span>
                </div>
                <h2 class="text-xl font-headline font-black text-white uppercase mb-2">Account Activated</h2>
                <p class="text-neutral-400 text-[10px] uppercase tracking-widest font-bold mb-8">Your password has been successfully set.</p>
                <a href="/login" class="inline-block bg-primary text-black font-headline font-black px-10 py-3 uppercase text-[10px] tracking-widest rounded-lg hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all">Sign In</a>
            </div>
        </div>
    </main>

    <script>
        window.showNotification = function(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            let color = '#4FFE49';
            if (type === 'error') color = '#ff7351';
            toast.className = `flex items-center gap-4 bg-[#0e0e0e] border-l-4 p-4 shadow-2xl min-w-[300px] pointer-events-auto transition-all duration-300 transform translate-x-full font-body`;
            toast.style.borderColor = color;
            toast.innerHTML = `<div class="flex-1 text-xs text-white font-medium">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.style.transform = 'translateX(0)', 10);
            setTimeout(() => {
                toast.style.transform = 'translateX(110%)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const mode = urlParams.get('mode');

        if (mode === 'reset') {
            document.querySelector('h1').innerText = 'Reset Password';
            document.querySelector('p').innerText = 'Set a new secure password for your account';
            document.title = 'VulnPrint | Reset Password';
            const btn = document.querySelector('button[type="submit"]');
            if (btn) btn.innerText = 'Reset Password';
            const successH2 = document.querySelector('#success-container h2');
            if (successH2) successH2.innerText = 'Password Reset';
            const successP = document.querySelector('#success-container p');
            if (successP) successP.innerText = 'Your new password has been established.';
        }

        if (!token) {
            document.getElementById('activation-form-container').innerHTML = `
                <div class="text-center py-10">
                    <span class="material-symbols-outlined text-error text-6xl mb-4">link_off</span>
                    <p class="text-error font-headline font-black uppercase text-xs tracking-widest">Invalid Token</p>
                    <p class="text-neutral-500 text-[10px] mt-2 uppercase tracking-widest font-bold">Please contact your administrator for a new link.</p>
                </div>`;
        }

        document.getElementById('activate-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                window.showNotification('Passwords do not match.', 'error');
                return;
            }

            try {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerText = 'ACTIVATING...';

                const res = await fetch('/api/users/activate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('activation-form-container').classList.add('hidden');
                    document.getElementById('success-container').classList.remove('hidden');
                } else {
                    window.showNotification(data.message || 'Failed to activate account.', 'error');
                    btn.disabled = false;
                    btn.innerText = 'ACTIVATE ACCOUNT';
                }
            } catch (err) {
                window.showNotification('System Error: Unable to activate account.', 'error');
                e.target.querySelector('button[type="submit"]').disabled = false;
                e.target.querySelector('button[type="submit"]').innerText = 'ACTIVATE ACCOUNT';
            }
        });
    </script>
</body>
</html>
