<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>VulnPrint | Activate Account</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                "primary": "#4FFE49",
                "surface": "#0e0e0e",
                "on-surface": "#ffffff",
                "error": "#ff7351"
              },
              fontFamily: { 
                headline: ['Space Grotesk', 'sans-serif'], 
                body: ['Inter', 'sans-serif'] 
              },
              boxShadow: { terminal: "0 0 0 1px rgba(38,38,38,0.85), 0 30px 80px rgba(0,0,0,0.55)" }
            }
          }
        }
    </script>
    <style>
        :root { color-scheme: dark; }
        body { margin: 0; background-color: #050505; }
        .radar-bg {
            background: 
                radial-gradient(circle at top right, rgba(79, 254, 73, 0.08), transparent 40%),
                radial-gradient(circle at bottom left, rgba(136, 246, 255, 0.05), transparent 40%),
                #050505;
        }
        .tile-card { background: rgba(19, 19, 19, 0.6); border: 1px solid #262626; backdrop-filter: blur(12px); }
    </style>
</head>
<body class="radar-bg min-h-screen text-on-surface font-body flex flex-col items-center justify-center p-6">

    <!-- Notification Container -->
    <div id="notification-container" class="fixed top-8 right-8 z-[300] flex flex-col gap-4 pointer-events-none"></div>

    <main class="w-full max-w-md relative z-10">
        <!-- 1. Logo in Upper Middle -->
        <div class="mb-10 text-center">
            <img alt="VulnPrint Logo" class="h-16 mx-auto brightness-110" src="/images/logo.png">
        </div>

        <!-- 2. Centered Content Box -->
        <div class="tile-card p-10 rounded-2xl shadow-terminal relative overflow-hidden">
            <div id="activation-form-container">
                <!-- Header -->
                <div class="text-center mb-8">
                    <h1 class="text-2xl font-headline font-black uppercase text-white mb-2">Activate Account</h1>
                    <p class="text-[10px] text-neutral-500 uppercase tracking-widest font-bold">Set up your account password</p>
                </div>

                <form id="activate-form" class="space-y-6">
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">New Password</label>
                        <input type="password" id="password" required oninput="evaluatePassword(this.value)" class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg font-body" placeholder="Enter new password">
                        
                        <div class="mt-3">
                            <div class="flex justify-between items-center mb-1">
                                <span class="text-[8px] font-black uppercase text-neutral-600 tracking-widest font-headline">Security Level</span>
                                <span id="pwd-strength-text" class="text-[8px] font-black uppercase tracking-widest text-neutral-600 font-headline">None</span>
                            </div>
                            <div class="flex gap-1 h-1 mb-3">
                                <div id="bar-1" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-2" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-3" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                                <div id="bar-4" class="flex-1 bg-neutral-800 rounded-full transition-all"></div>
                            </div>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1.5 text-[8px] font-bold text-neutral-600 uppercase tracking-widest font-headline">
                                <div class="flex items-center gap-1 transition-colors" id="req-length"><span class="material-symbols-outlined text-[10px]">close</span> 8+ Characters</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-upper"><span class="material-symbols-outlined text-[10px]">close</span> 1 Uppercase</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-lower"><span class="material-symbols-outlined text-[10px]">close</span> 1 Lowercase</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-num"><span class="material-symbols-outlined text-[10px]">close</span> 1 Number</div>
                                <div class="flex items-center gap-1 transition-colors" id="req-spec"><span class="material-symbols-outlined text-[10px]">close</span> 1 Special Char</div>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[9px] font-headline font-black text-primary/60 uppercase tracking-widest ml-1 mb-2">Confirm Password</label>
                        <input type="password" id="confirmPassword" required class="w-full bg-black/60 border border-neutral-800 text-white p-4 text-sm focus:border-primary outline-none transition-colors rounded-lg font-body" placeholder="Confirm new password">
                    </div>
                    <button type="submit" id="submit-btn" class="w-full bg-primary text-black font-headline font-black py-4 uppercase text-[10px] tracking-widest hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all rounded-lg mt-4">Activate Account</button>
                </form>
            </div>

            <div id="success-container" class="hidden text-center py-10">
                <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                    <span class="material-symbols-outlined text-primary text-5xl">verified_user</span>
                </div>
                <h2 class="text-xl font-headline font-black text-white uppercase mb-2">Account Activated</h2>
                <p class="text-neutral-400 text-[10px] uppercase tracking-widest font-bold mb-8">Your password has been successfully set.</p>
                <a href="/login" class="inline-block bg-primary text-black font-headline font-black px-10 py-3 uppercase text-[10px] tracking-widest rounded-lg hover:shadow-[0_0_25px_rgba(79,254,73,0.35)] transition-all">Sign In</a>
            </div>
        </div>
    </main>

    <script>
        function evaluatePassword(pwd) {
            let strength = 0;
            const reqs = {
                length: pwd.length >= 8,
                upper: /[A-Z]/.test(pwd),
                lower: /[a-z]/.test(pwd),
                num: /[0-9]/.test(pwd),
                spec: /[^A-Za-z0-9]/.test(pwd)
            };

            if (reqs.length) strength++;
            if (reqs.upper) strength++;
            if (reqs.lower) strength++;
            if (reqs.num) strength++;
            if (reqs.spec) strength++;

            const updateReq = (id, met) => {
                const el = document.getElementById(id);
                if (met) {
                    el.classList.remove('text-neutral-600');
                    el.classList.add('text-primary');
                    el.querySelector('span').innerText = 'check';
                } else {
                    el.classList.remove('text-primary');
                    el.classList.add('text-neutral-600');
                    el.querySelector('span').innerText = 'close';
                }
            };

            updateReq('req-length', reqs.length);
            updateReq('req-upper', reqs.upper);
            updateReq('req-lower', reqs.lower);
            updateReq('req-num', reqs.num);
            updateReq('req-spec', reqs.spec);

            const bars = [document.getElementById('bar-1'), document.getElementById('bar-2'), document.getElementById('bar-3'), document.getElementById('bar-4')];
            bars.forEach(b => b.className = 'flex-1 bg-neutral-800 rounded-full transition-all');
            
            const textEl = document.getElementById('pwd-strength-text');
            
            if (pwd.length === 0) {
                textEl.innerText = 'None';
                textEl.className = 'text-[8px] font-black uppercase tracking-widest text-neutral-600 font-headline';
            } else if (strength <= 3) {
                bars[0].classList.add('bg-error');
                if (strength >= 2) bars[1].classList.add('bg-error');
                textEl.innerText = 'Weak';
                textEl.className = 'text-[8px] font-black uppercase tracking-widest text-error font-headline';
            } else if (strength === 4) {
                bars[0].classList.add('bg-orange-500');
                bars[1].classList.add('bg-orange-500');
                bars[2].classList.add('bg-orange-500');
                textEl.innerText = 'Good';
                textEl.className = 'text-[8px] font-black uppercase tracking-widest text-orange-500 font-headline';
            } else if (strength === 5) {
                bars.forEach(b => b.classList.add('bg-primary'));
                textEl.innerText = 'Strong';
                textEl.className = 'text-[8px] font-black uppercase tracking-widest text-primary font-headline';
            }
            
            return strength === 5;
        }

        window.showNotification = function(message, type = 'info') {
            const container = document.getElementById('notification-container');
            const toast = document.createElement('div');
            let color = '#4FFE49';
            if (type === 'error') color = '#ff7351';
            toast.className = `flex items-center gap-4 bg-[#0e0e0e] border-l-4 p-4 shadow-2xl min-w-[300px] pointer-events-auto transition-all duration-300 transform translate-x-full font-body`;
            toast.style.borderColor = color;
            toast.innerHTML = `<div class="flex-1 text-xs text-white font-medium">${message}</div>`;
            container.appendChild(toast);
            setTimeout(() => toast.style.transform = 'translateX(0)', 10);
            setTimeout(() => {
                toast.style.transform = 'translateX(110%)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('activation-form-container').innerHTML = `
                <div class="text-center py-10">
                    <span class="material-symbols-outlined text-error text-6xl mb-4">link_off</span>
                    <p class="text-error font-headline font-black uppercase text-xs tracking-widest">Invalid Token</p>
                    <p class="text-neutral-500 text-[10px] mt-2 uppercase tracking-widest font-bold">Please contact your administrator for a new link.</p>
                </div>`;
        }

        document.getElementById('activate-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!evaluatePassword(password)) {
                window.showNotification('Password does not meet security requirements.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                window.showNotification('Passwords do not match.', 'error');
                return;
            }

            try {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.innerText = 'ACTIVATING...';

                const res = await fetch('/api/users/activate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ token, password })
                });

                const data = await res.json();
                
                if (res.ok) {
                    document.getElementById('activation-form-container').classList.add('hidden');
                    document.getElementById('success-container').classList.remove('hidden');
                } else {
                    window.showNotification(data.message || 'Failed to activate account.', 'error');
                    btn.disabled = false;
                    btn.innerText = 'ACTIVATE ACCOUNT';
                }
            } catch (err) {
                window.showNotification('System Error: Unable to activate account.', 'error');
                e.target.querySelector('button[type="submit"]').disabled = false;
                e.target.querySelector('button[type="submit"]').innerText = 'ACTIVATE ACCOUNT';
            }
        });
    </script>
</body>
</html>
