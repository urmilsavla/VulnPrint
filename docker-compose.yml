version: '3.8'
services:
  db:
    image: postgres:15
    container_name: vulnprint_db
    environment:
      POSTGRES_USER: vulnuser
      POSTGRES_PASSWORD: vulnpassword
      POSTGRES_DB: vulnprint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
